pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx,json}"
      run: pnpm turbo lint
    knip:
      run: pnpm knip || true
    check-podfile-lock:
      run: sh ci_scripts/check-podfile-lock.sh

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm turbo typecheck
    test:
      run: pnpm turbo test
