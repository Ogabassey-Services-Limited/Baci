pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: npx biome check --changed {staged_files}
    knip:
      run: npx knip --no-exit-code # Warn only for now to avoid blocking commits on unused exports

pre-push:
  parallel: true
  commands:
    typecheck:
      run: npm run typecheck
    test:
      run: npm run test
