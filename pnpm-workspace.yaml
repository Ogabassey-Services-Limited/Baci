  "@react-native-google-signin/google-signin@16.1.2": "patches/@react-native-google-signin/google-signin@16.1.2.patch"
  '@react-native/gradle-plugin@0.85.3': patches/@react-native__gradle-plugin@0.85.3.patch
  "lottie-react-native@7.3.8": "patches/lottie-react-native@7.3.8.patch"
  "novel@1.0.2": "patches/novel@1.0.2.patch"
  "react-native@0.85.3": "patches/react-native@0.85.3.patch"
  "react-native-mmkv@4.3.1": "patches/react-native-mmkv@4.3.1.patch"
  "react-native-nitro-modules@0.35.9": "patches/react-native-nitro-modules@0.35.9.patch"
  "react-native-phone-number-input@2.1.0": "patches/react-native-phone-number-input@2.1.0.patch"
  "react-native-purchases@10.2.0": "patches/react-native-purchases@10.2.0.patch"
  "react-native-safe-area-context@5.8.0": "patches/react-native-safe-area-context@5.8.0.patch"
