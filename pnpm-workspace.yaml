minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Security hotfixes released within the cooldown window; Dependabot alerts opened 2026-06-15.
  - ws@5.2.5 || 6.2.4 || 7.5.11 || 8.21.0
  - protobufjs@7.6.3
  - form-data@2.5.6 || 3.0.5 || 4.0.6
  - js-yaml@4.2.0
  - '@babel/core@7.29.6'
# Refuse packages whose trust signals (provenance, signatures) weaken between
# updates. trustLockfile keeps already-locked entries installable — the current
# lockfile carries upstream trust downgrades (e.g. undici-types@6.21.0,
# uuid@13.0.1 shipped without the provenance their earlier releases had) that
# would otherwise fail every install; new resolutions are still enforced.
trustPolicy: no-downgrade
trustLockfile: true
trustPolicyExclude:
  # Existing direct dependencies already locked before this security-only
  # override update. pnpm 11.7 re-checks trust history while refreshing the
  # lockfile; keep the exceptions exact so future updates remain protected.
  - '@react-native-firebase/app@23.8.8'
  - 'react-lite-youtube-embed@3.5.1'
  - 'ua-parser-js@0.7.41 || 1.0.41'
  - 'pino@9.14.0'
  - 'express-rate-limit@8.2.2'
  - 'reselect@5.1.1'
  - 'react-redux@9.2.0'
  - 'jose@4.15.9'
  - 'undici-types@6.21.0'
  - 'semver@6.3.1'
  - 'uuid@13.0.1'
  # Added during the Phase-1 dependency sweep — @copilotkit/runtime@1.60.1 pulls
  # several @ag-ui/* packages manually published by the org's listed maintainers
  # (_mme = founder Markus Ecker, copilotkit = org account; repo ag-ui-protocol/ag-ui),
  # lacking the CI ("GitHub Actions") provenance their siblings carry. No publisher
  # swap; verified safe. (CI-published @ag-ui/* like core/client/encoder are unaffected.)
  - '@ag-ui/langgraph@0.0.41'
  - '@ag-ui/a2ui-toolkit@0.0.3'
  - '@ag-ui/mcp-apps-middleware@0.0.3'
  - '@ag-ui/mcp-middleware@0.0.1'

# Workspace linkers & hoisting configurations for React Native/Expo in pnpm v11
nodeLinker: hoisted
shamefullyHoist: true
publicHoistPattern:
  - "*expo*"
  - "*react-native*"
networkTimeout: 1000000
strictDepBuilds: true

packages:
  - "apps/*"
  - "packages/*"
  - "apps/web/mcp-server/widgets"

# High-performance build script approvals for pnpm v11 (replaces legacy onlyBuiltDependencies)
# Must be configured as a YAML mapping of package matchers to booleans
# (e.g. package matcher strings/globs as keys mapped to true/false values)
allowBuilds:
  "@firebase/util": true
  "@scarf/scarf": true
  core-js: true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  protobufjs: true
  puppeteer: true
  sharp: true
  unrs-resolver: true

overrides:
  # --- Patched-dependency version locks ---
  # Each of these has a version-specific entry in `patchedDependencies` (an Android/native
  # gradle or runtime fix). The patch only applies to its exact version, so a `pnpm up`
  # that bumped it within range would orphan the patch and risk the native build. Pin to
  # the patched version; to bump one, refresh its patch in the same change.
  react-native-purchases: "10.2.0"
  "@react-native-google-signin/google-signin": "16.1.2"
  lottie-react-native: "7.3.8"
  novel: "1.0.2"
  react-native-mmkv: "4.3.1"
  react-native-nitro-modules: "0.35.9"
  react-native-phone-number-input: "2.1.0"
  react-native-safe-area-context: "5.8.0"
  react-native-webview: "13.16.1"
  # --- Security / dedupe overrides ---
  # Pin to 6.1.6 to mitigate GHSA-737v-mqg7-c878 / CVE-2026-35209: replace the vulnerable transitive deep-merge helper.
  defu: "6.1.6"
  # Pin to 0.8.13 to mitigate GHSA-f6ww-3ggp-fr8h, GHSA-2v35-w6hq-6mfw, GHSA-j759-j44w-7fr8, and GHSA-x6wf-f3px-wcqx: keep Expo plist tooling on the patched 0.8.x line.
  "@xmldom/xmldom": "0.8.13"
  follow-redirects: "^1.16.0"
  # Dedupe to the current React 19 type release. Without a single override, pnpm hoists one copy at the root and nested copies under React Native consumers, causing TS2769 `two different types with this name` errors on ref props.
  "@types/react": "19.2.17"
  # Dedupe to a single version. Two transitive consumers (@firebase/database-compat 2.1.0 vs 2.1.1) pull in @firebase/util 1.13.0 and 1.14.0 simultaneously; under node-linker=hoisted the second copy goes into nested node_modules/@firebase/database-types/node_modules/ and pnpm 10.28 races its own extraction there, failing with ENOENT on the temp-file rename. Reproduced in storefront Android runs 25457441264 and the 2026-05-01 466a00fc86 run.
  "@firebase/util": "1.14.0"
  # Dedupe with @firebase/util — same reason.
  "@firebase/database-types": "1.0.17"
  # Dedupe with @firebase/util — same reason.
  "@firebase/database-compat": "2.1.1"
  smol-toml: ">=1.6.1"
  picomatch: ">=4.0.4"
  yaml: ">=2.8.3"
  # Pin to the patched esbuild 0.28 line for local dev-server path hardening and binary integrity fixes.
  esbuild: "^0.28.1"
  # Pin to ^0.34.5 to mitigate security advisories and maintain image scaling stability.
  sharp: "^0.34.5"
  prismjs: "^1.30.0"
  # Pin to 6.15.2 to mitigate GHSA-q8mj-m7cp-5q26 in qs.stringify comma-format array handling.
  qs: "6.15.2"
  markdown-it: "14.2.0"
  "@modelcontextprotocol/sdk": "^1.25.2"
  react-native-worklets: "0.8.3"
  # Pin patched Hono floor for GHSA-2gcr-mfcq-wcc3, GHSA-xrhx-7g5j-rcj5, GHSA-3hrh-pfw6-9m5x, and GHSA-f577-qrjj-4474.
  hono: "^4.12.23"
  "@hono/node-server": "^2.0.2"
  svgo: "^3.3.3"
  underscore: "^1.13.8"
  dompurify: "3.4.9"
  # Pin to the current patched 2.x release for GHSA-rpr9-rxv7-x643 / CVE-2026-44990: prevent xmp raw-text passthrough from rehydrating attacker-controlled markup after sanitization.
  sanitize-html: "2.17.5"
  # Pin to 7.6.3 to close the 7.x CVE set, including GHSA-jggg-4jg4-v7c6, GHSA-wcpc-wj8m-hjx6, and GHSA-f38q-mgvj-vph7, while preserving the protobufjs 7 major.
  protobufjs: "7.6.3"
  # Pin to 1.1.1 to close GHSA-mm78-2hpw-9j97 (overlong UTF-8 decoding allows mis-encoded sequences through). 1.1.0 is the vulnerable transitive that the legacy protobufjs 6.x consumers still drag in; 1.1.1 is the patched release.
  "@protobufjs/utf8": "1.1.1"
  rollup: "^4.59.0"
  # Pin to 5.3.1 to mitigate GHSA-rpmf-866q-6p89 / CVE-2026-44240 (unbounded multiline control-response buffering DoS) and the prior GHSA-rp42-5vxx-qpwr, both via transitive Lighthouse tooling.
  basic-ftp: "5.3.1"
  # Pin legacy AJV 6 consumers to 6.14.0 to mitigate GHSA-2g4f-4pwh-qvx6 without forcing AJV 8 into older consumers.
  "ajv@<6.14.0": "6.14.0"
  "glob@13": "13.0.6"
  minimatch: "10.2.3"
  # Pin older uuid consumers to 11.1.1 to mitigate GHSA-w5hq-g745-h8pq while staying on a CommonJS-compatible patched release.
  "minimatch>brace-expansion": "5.0.6"
  # Pin vulnerable ws consumers to patched lines for GHSA-96hv-2xvq-fx4p / CVE-2026-48779 without forcing cross-major upgrades.
  "ws@>=5 <5.2.5": "5.2.5"
  "ws@>=6 <6.2.4": "6.2.4"
  "ws@>=7 <7.5.11": "7.5.11"
  "ws@>=8 <8.21.0": "8.21.0"
  h3: "1.15.9"
  tar: "^7.5.8"
  # Pin to the current patched 5.x release for GHSA-gh4j-gqv2-49f6 in XMLBuilder comment/CDATA serialization while keeping transitive feed and storage XML tooling on the patched major.
  fast-xml-parser: "5.9.0"
  # Pin to 1.2.0 to mitigate two Dependabot alerts on the version that fast-xml-parser 5.x pulls in transitively: the high-severity attribute-quote bypass (alert #162, fixed 1.1.7) and the medium-severity comment-regex bypass (alert #161, fixed 1.1.6). 1.2.0 is the latest published. fast-xml-parser declares fast-xml-builder ^1.1.5 so this override stays inside its accepted semver range. Exact pin matches the convention for CVE-motivated overrides in this file.
  fast-xml-builder: "1.2.0"
  # Pin to 3.1.2 to mitigate two high-severity Dependabot alerts on the 3.1.0 transitive of ajv@8.18.0: GHSA-v39h-62p7-jpjc (alert #164, host confusion via percent-encoded authority delimiters, fixed 3.1.2) and the path-traversal-via-percent-encoded-dot-segments advisory (alert #163, fixed 3.1.1). ajv 8.x has no fast-uri peer constraint so the override is safe. Exact pin matches the convention for CVE-motivated overrides in this file.
  fast-uri: "3.1.2"
  # Pin to 4.1.0 so Vitest 4.x can import isAgent from a compatible std-env release.
  std-env: "4.1.0"
  # Pin to 3.1.0 so Vitest 4.x consumers resolve a compatible color utility during CLI startup.
  tinyrainbow: "3.1.0"
  # Pin to the current patched 8.x release to mitigate GHSA-qx2v-qp2m-jg93 in CSS stringify output.
  postcss: "8.5.15"
  # Preserve the existing legacy uuid guard for pre-7 consumers while keeping Expo xcode@3.0.1 on its CommonJS-compatible uuid@11.1.1 resolution (preventing ESM require crashes).
  "uuid@<7": "11.1.1"
  # Pin older uuid consumers to 11.1.1 to mitigate GHSA-w5hq-g745-h8pq while staying on a CommonJS-compatible patched release.
  "uuid@>=7 <11.1.1": "11.1.1"
  "uuid@>=11 <11.1.1": "11.1.1"
  # Pin uuid 12.x consumers to 12.0.1 to mitigate GHSA-w5hq-g745-h8pq.
  "uuid@>=12 <12.0.1": "12.0.1"
  # Pin uuid 13.x consumers to 13.0.1 to mitigate GHSA-w5hq-g745-h8pq.
  "uuid@>=13 <13.0.1": "13.0.1"
  # Pin to 10.2.0 to mitigate GHSA-v2v4-37r5-5v8g via transitive Lighthouse/Puppeteer proxy tooling.
  ip-address: "10.2.0"
  # Pin to 16.2.9 to mitigate GHSA-q4gf-8mx6-v5v3 in Server Components while staying on the current Next.js 16 patch.
  next: "16.2.9"
  flatted: "3.4.2"
  lodash: "4.18.1"
  lodash-es: "4.18.1"
  diff: "^8.0.3"
  react-native-screens: "4.25.2"
  react-native-reanimated: "4.3.1"
  react-native-svg: "15.15.4"
  express-rate-limit: "8.2.2"
  # Keep the editor ecosystem on one current TipTap 3.x instance. Novel and Puck depend
  # on older TipTap ranges, but the web editor imports current TipTap extensions;
  # with hoisted installs, mixed TipTap minors create incompatible types.
  "@tiptap/core": "3.26.1"
  "@tiptap/pm": "3.26.1"
  "@tiptap/react": "3.26.1"
  "@tiptap/starter-kit": "3.26.1"
  "@tiptap/suggestion": "3.26.1"
  "@tiptap/extensions": "3.26.1"
  "@tiptap/html": "3.26.1"
  "@tiptap/extension-blockquote": "3.26.1"
  "@tiptap/extension-bold": "3.26.1"
  "@tiptap/extension-bubble-menu": "3.26.1"
  "@tiptap/extension-bullet-list": "3.26.1"
  "@tiptap/extension-character-count": "3.26.1"
  "@tiptap/extension-code": "3.26.1"
  "@tiptap/extension-code-block": "3.26.1"
  "@tiptap/extension-code-block-lowlight": "3.26.1"
  "@tiptap/extension-color": "3.26.1"
  "@tiptap/extension-document": "3.26.1"
  "@tiptap/extension-dropcursor": "3.26.1"
  "@tiptap/extension-floating-menu": "3.26.1"
  "@tiptap/extension-gapcursor": "3.26.1"
  "@tiptap/extension-hard-break": "3.26.1"
  "@tiptap/extension-heading": "3.26.1"
  "@tiptap/extension-highlight": "3.26.1"
  "@tiptap/extension-horizontal-rule": "3.26.1"
  "@tiptap/extension-image": "3.26.1"
  "@tiptap/extension-italic": "3.26.1"
  "@tiptap/extension-link": "3.26.1"
  "@tiptap/extension-list": "3.26.1"
  "@tiptap/extension-list-item": "3.26.1"
  "@tiptap/extension-list-keymap": "3.26.1"
  "@tiptap/extension-ordered-list": "3.26.1"
  "@tiptap/extension-paragraph": "3.26.1"
  "@tiptap/extension-placeholder": "3.26.1"
  "@tiptap/extension-strike": "3.26.1"
  "@tiptap/extension-subscript": "3.26.1"
  "@tiptap/extension-superscript": "3.26.1"
  "@tiptap/extension-table": "3.26.1"
  "@tiptap/extension-table-cell": "3.26.1"
  "@tiptap/extension-table-header": "3.26.1"
  "@tiptap/extension-table-row": "3.26.1"
  "@tiptap/extension-task-item": "3.26.1"
  "@tiptap/extension-task-list": "3.26.1"
  "@tiptap/extension-text": "3.26.1"
  "@tiptap/extension-text-align": "3.26.1"
  "@tiptap/extension-text-style": "3.26.1"
  "@tiptap/extension-typography": "3.26.1"
  "@tiptap/extension-underline": "3.26.1"
  "@tiptap/extension-youtube": "3.26.1"
  # Pin to 1.16.0 to mitigate the GHSA-w9j2-pvgh-6h63 / GHSA-pmwg-cvhr-8vh7 / GHSA-6chq-wfr3-2hj9 advisory cluster affecting axios versions before 1.15.1.
  axios: "1.16.0"
  # Pin to 0.6.0 to mitigate GHSA-3644-q5cj-c5c7: keep CopilotKit/LangChain prompt-pull behavior on the patched JS trust-boundary release without a broad CopilotKit upgrade.
  langsmith: "0.6.0"
  "@modelcontextprotocol/sdk>ajv": "^8.18.0"
  "expo-build-properties>ajv": "^8.18.0"
  "expo-dev-launcher>ajv": "^8.18.0"
  http-proxy-agent: "^7.0.2"
  unhead: "^2.1.13"
  "@unhead/vue": "^2.1.13"
  happy-dom: ">=20.8.8"
  node-forge: "1.4.0"
  path-to-regexp: ">=8.4.0"
  # Pin to ^11.15.0 to close GHSA-6m6c-36f7-fhxh (Gantt-chart infinite-loop DoS), GHSA-87f9-hvmw-gh4p (CSS injection via configuration), GHSA-ghcm-xqfw-q4vr (HTML injection in classDef state diagrams), and GHSA-xcj9-5m2h-648r (CSS injection in classDefs). All four advisories fixed in 11.15.0. mermaid arrives here transitively via streamdown 1.6.11 (markdown streaming for the AI chat rendering pipeline).
  mermaid: "^11.15.0"
  # Pin vulnerable gRPC consumers to their patched minor releases for CVE-2026-48068 and CVE-2026-48069 while respecting transitive semver bounds.
  "@grpc/grpc-js@>=1.9.0 <1.9.16": "1.9.16"
  "@grpc/grpc-js@>=1.10.0 <1.10.12": "1.10.12"
  "@grpc/grpc-js@>=1.11.0 <1.11.4": "1.11.4"
  "@grpc/grpc-js@>=1.12.0 <1.12.7": "1.12.7"
  "@grpc/grpc-js@>=1.13.0 <1.13.5": "1.13.5"
  "@grpc/grpc-js@>=1.14.0 <1.14.4": "1.14.4"
  # google-gax declares a broad ^1.10.x range; keep it on the latest patched 1.14.x line instead of the 1.10.x patched floor.
  "google-gax>@grpc/grpc-js": "1.14.4"
  # Pin vulnerable shell-quote consumers to the first patched release for CVE-2026-9277.
  "shell-quote@>=1.1.0 <=1.8.3": "1.8.4"
  # Pin form-data patched lines for GHSA-hmw2-7cc7-3qxx / CVE-2026-12143.
  "form-data@<2.5.6": "2.5.6"
  "form-data@>=3 <3.0.5": "3.0.5"
  "form-data@>=4 <4.0.6": "4.0.6"
  # Pin js-yaml to the patched 4.2 line for GHSA-h67p-54hq-rp68 / CVE-2026-53550.
  js-yaml: "4.2.0"
  # Pin OpenTelemetry packages to the current 2.8 line to satisfy the core advisory while keeping @vercel/otel on its documented >=2 peer range.
  "@opentelemetry/core": "2.8.0"
  "@opentelemetry/resources": "2.8.0"
  "@opentelemetry/sdk-trace-base": "2.8.0"
  # Pin Babel 7 to the patched sourcemap handling release for GHSA-4x5r-pxfx-6jf8 / CVE-2026-49356.
  "@babel/core": "7.29.6"

