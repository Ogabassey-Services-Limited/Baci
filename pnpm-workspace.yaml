minimumReleaseAge: 1440
# trustPolicy: check


# Workspace linkers & hoisting configurations for React Native/Expo in pnpm v11
nodeLinker: hoisted
shamefullyHoist: true
publicHoistPattern:
  - "*expo*"
  - "*react-native*"
networkTimeout: 1000000
strictDepBuilds: true

packages:
  - "apps/*"
  - "packages/*"
  - "apps/web/mcp-server/widgets"

# High-performance build script approvals for pnpm v11 (replaces legacy onlyBuiltDependencies)
# Must be configured as a YAML mapping of package matchers to booleans
# (e.g. package matcher strings/globs as keys mapped to true/false values)
allowBuilds:
  "@firebase/util": true
  "@scarf/scarf": true
  core-js: true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  protobufjs: true
  puppeteer: true
  sharp: true
  unrs-resolver: true

overrides:
  # Pin to 6.1.6 to mitigate GHSA-737v-mqg7-c878 / CVE-2026-35209: replace the vulnerable transitive deep-merge helper.
  defu: "6.1.6"
  # Pin to 0.8.13 to mitigate GHSA-f6ww-3ggp-fr8h, GHSA-2v35-w6hq-6mfw, GHSA-j759-j44w-7fr8, and GHSA-x6wf-f3px-wcqx: keep Expo plist tooling on the patched 0.8.x line.
  "@xmldom/xmldom": "0.8.13"
  follow-redirects: "^1.16.0"
  # Dedupe to a single version. Without this, pnpm hoists 19.2.13 at the root and nested copies at 19.2.14, causing TS2769 'two different types with this name' errors on react-native ref props.
  "@types/react": "19.2.14"
  # Dedupe to a single version. Two transitive consumers (@firebase/database-compat 2.1.0 vs 2.1.1) pull in @firebase/util 1.13.0 and 1.14.0 simultaneously; under node-linker=hoisted the second copy goes into nested node_modules/@firebase/database-types/node_modules/ and pnpm 10.28 races its own extraction there, failing with ENOENT on the temp-file rename. Reproduced in storefront Android runs 25457441264 and the 2026-05-01 466a00fc86 run.
  "@firebase/util": "1.14.0"
  # Dedupe with @firebase/util — same reason.
  "@firebase/database-types": "1.0.17"
  # Dedupe with @firebase/util — same reason.
  "@firebase/database-compat": "2.1.1"
  smol-toml: ">=1.6.1"
  picomatch: ">=4.0.4"
  yaml: ">=2.8.3"
  esbuild: "^0.25.0"
  # Pin to ^0.34.5 to mitigate security advisories and maintain image scaling stability.
  sharp: "^0.34.5"
  prismjs: "^1.30.0"
  # Pin to 6.15.2 to mitigate GHSA-q8mj-m7cp-5q26 in qs.stringify comma-format array handling.
  qs: "6.15.2"
  markdown-it: "^14.1.1"
  "@modelcontextprotocol/sdk": "^1.25.2"
  react-native-worklets: "0.8.3"
  # Pin patched Hono floor for GHSA-2gcr-mfcq-wcc3, GHSA-xrhx-7g5j-rcj5, GHSA-3hrh-pfw6-9m5x, and GHSA-f577-qrjj-4474.
  hono: "^4.12.23"
  "@hono/node-server": "^2.0.2"
  svgo: "^3.3.3"
  underscore: "^1.13.8"
  dompurify: "^3.4.0"
  # Pin to 2.17.4 to mitigate GHSA-rpr9-rxv7-x643 / CVE-2026-44990: prevent xmp raw-text passthrough from rehydrating attacker-controlled markup after sanitization.
  sanitize-html: "2.17.4"
  # Pin to 7.6.0 to close the 7.x CVE set, including GHSA-jggg-4jg4-v7c6 / CVE-2026-45740 for unbounded recursive JSON descriptor expansion. This preserves the protobufjs 7 major while moving beyond the prior 7.5.6 override, which became vulnerable.
  protobufjs: "7.6.0"
  # Pin to 1.1.1 to close GHSA-mm78-2hpw-9j97 (overlong UTF-8 decoding allows mis-encoded sequences through). 1.1.0 is the vulnerable transitive that the legacy protobufjs 6.x consumers still drag in; 1.1.1 is the patched release.
  "@protobufjs/utf8": "1.1.1"
  rollup: "^4.59.0"
  # Pin to 5.3.1 to mitigate GHSA-rpmf-866q-6p89 / CVE-2026-44240 (unbounded multiline control-response buffering DoS) and the prior GHSA-rp42-5vxx-qpwr, both via transitive Lighthouse tooling.
  basic-ftp: "5.3.1"
  # Pin legacy AJV 6 consumers to 6.14.0 to mitigate GHSA-2g4f-4pwh-qvx6 without forcing AJV 8 into older consumers.
  "ajv@<6.14.0": "6.14.0"
  "glob@13": "13.0.6"
  minimatch: "10.2.3"
  # Pin older uuid consumers to 11.1.1 to mitigate GHSA-w5hq-g745-h8pq while staying on a CommonJS-compatible patched release.
  "minimatch>brace-expansion": "5.0.6"
  # Pin vulnerable ws 8.x consumers to 8.20.1 to mitigate GHSA-58qx-3vcg-4xpx / CVE-2026-45736 without forcing older ws 7.x consumers across a major version.
  "ws@>=8 <8.20.1": "8.20.1"
  h3: "1.15.9"
  tar: "^7.5.8"
  # Pin to 5.7.2 to mitigate GHSA-gh4j-gqv2-49f6 in XMLBuilder comment/CDATA serialization while keeping transitive feed and storage XML tooling on the patched 5.x line.
  fast-xml-parser: "5.7.2"
  # Pin to 1.2.0 to mitigate two Dependabot alerts on the version that fast-xml-parser@5.7.2 pulls in transitively: the high-severity attribute-quote bypass (alert #162, fixed 1.1.7) and the medium-severity comment-regex bypass (alert #161, fixed 1.1.6). 1.2.0 is the latest published. fast-xml-parser declares fast-xml-builder ^1.1.5 so this override stays inside its accepted semver range. Exact pin matches the convention for CVE-motivated overrides in this file.
  fast-xml-builder: "1.2.0"
  # Pin to 3.1.2 to mitigate two high-severity Dependabot alerts on the 3.1.0 transitive of ajv@8.18.0: GHSA-v39h-62p7-jpjc (alert #164, host confusion via percent-encoded authority delimiters, fixed 3.1.2) and the path-traversal-via-percent-encoded-dot-segments advisory (alert #163, fixed 3.1.1). ajv 8.x has no fast-uri peer constraint so the override is safe. Exact pin matches the convention for CVE-motivated overrides in this file.
  fast-uri: "3.1.2"
  # Pin to 4.1.0 so Vitest 4.x can import isAgent from a compatible std-env release.
  std-env: "4.1.0"
  # Pin to 3.1.0 so Vitest 4.x consumers resolve a compatible color utility during CLI startup.
  tinyrainbow: "3.1.0"
  # Pin to 8.5.10 to mitigate GHSA-qx2v-qp2m-jg93 in CSS stringify output.
  postcss: "8.5.10"
  # Preserve the existing legacy uuid guard for pre-7 consumers while keeping Expo xcode@3.0.1 on its CommonJS-compatible uuid@11.1.1 resolution (preventing ESM require crashes).
  "uuid@<7": "11.1.1"
  # Pin older uuid consumers to 11.1.1 to mitigate GHSA-w5hq-g745-h8pq while staying on a CommonJS-compatible patched release.
  "uuid@>=7 <11.1.1": "11.1.1"
  "uuid@>=11 <11.1.1": "11.1.1"
  # Pin uuid 12.x consumers to 12.0.1 to mitigate GHSA-w5hq-g745-h8pq.
  "uuid@>=12 <12.0.1": "12.0.1"
  # Pin uuid 13.x consumers to 13.0.1 to mitigate GHSA-w5hq-g745-h8pq.
  "uuid@>=13 <13.0.1": "13.0.1"
  # Pin to 10.2.0 to mitigate GHSA-v2v4-37r5-5v8g via transitive Lighthouse/Puppeteer proxy tooling.
  ip-address: "10.2.0"
  # Pin to 16.2.7 to mitigate GHSA-q4gf-8mx6-v5v3 in Server Components while staying on the current Next.js 16 patch.
  next: "16.2.7"
  flatted: "3.4.2"
  lodash: "4.18.1"
  lodash-es: "4.18.1"
  diff: "^8.0.3"
  react-native-screens: "4.25.2"
  react-native-reanimated: "4.3.1"
  react-native-svg: "15.15.4"
  express-rate-limit: "8.2.2"
  # Keep the editor ecosystem on one TipTap 3.x instance. Novel and Puck depend
  # on older TipTap ranges, but the web editor imports current TipTap extensions;
  # with hoisted installs, mixed TipTap majors/minors create incompatible types.
  "@tiptap/core": "3.24.0"
  "@tiptap/pm": "3.24.0"
  "@tiptap/react": "3.24.0"
  "@tiptap/starter-kit": "3.24.0"
  "@tiptap/suggestion": "3.24.0"
  "@tiptap/extensions": "3.24.0"
  "@tiptap/html": "3.24.0"
  "@tiptap/extension-blockquote": "3.24.0"
  "@tiptap/extension-bold": "3.24.0"
  "@tiptap/extension-bubble-menu": "3.24.0"
  "@tiptap/extension-bullet-list": "3.24.0"
  "@tiptap/extension-character-count": "3.24.0"
  "@tiptap/extension-code": "3.24.0"
  "@tiptap/extension-code-block": "3.24.0"
  "@tiptap/extension-code-block-lowlight": "3.24.0"
  "@tiptap/extension-color": "3.24.0"
  "@tiptap/extension-document": "3.24.0"
  "@tiptap/extension-dropcursor": "3.24.0"
  "@tiptap/extension-floating-menu": "3.24.0"
  "@tiptap/extension-gapcursor": "3.24.0"
  "@tiptap/extension-hard-break": "3.24.0"
  "@tiptap/extension-heading": "3.24.0"
  "@tiptap/extension-highlight": "3.24.0"
  "@tiptap/extension-horizontal-rule": "3.24.0"
  "@tiptap/extension-image": "3.24.0"
  "@tiptap/extension-italic": "3.24.0"
  "@tiptap/extension-link": "3.24.0"
  "@tiptap/extension-list": "3.24.0"
  "@tiptap/extension-list-item": "3.24.0"
  "@tiptap/extension-list-keymap": "3.24.0"
  "@tiptap/extension-ordered-list": "3.24.0"
  "@tiptap/extension-paragraph": "3.24.0"
  "@tiptap/extension-placeholder": "3.24.0"
  "@tiptap/extension-strike": "3.24.0"
  "@tiptap/extension-subscript": "3.24.0"
  "@tiptap/extension-superscript": "3.24.0"
  "@tiptap/extension-table": "3.24.0"
  "@tiptap/extension-table-cell": "3.24.0"
  "@tiptap/extension-table-header": "3.24.0"
  "@tiptap/extension-table-row": "3.24.0"
  "@tiptap/extension-task-item": "3.24.0"
  "@tiptap/extension-task-list": "3.24.0"
  "@tiptap/extension-text": "3.24.0"
  "@tiptap/extension-text-align": "3.24.0"
  "@tiptap/extension-text-style": "3.24.0"
  "@tiptap/extension-typography": "3.24.0"
  "@tiptap/extension-underline": "3.24.0"
  "@tiptap/extension-youtube": "3.24.0"
  # Pin to 1.16.0 to mitigate the GHSA-w9j2-pvgh-6h63 / GHSA-pmwg-cvhr-8vh7 / GHSA-6chq-wfr3-2hj9 advisory cluster affecting axios versions before 1.15.1.
  axios: "1.16.0"
  # Pin to 0.6.0 to mitigate GHSA-3644-q5cj-c5c7: keep CopilotKit/LangChain prompt-pull behavior on the patched JS trust-boundary release without a broad CopilotKit upgrade.
  langsmith: "0.6.0"
  "@modelcontextprotocol/sdk>ajv": "^8.18.0"
  "expo-build-properties>ajv": "^8.18.0"
  "expo-dev-launcher>ajv": "^8.18.0"
  http-proxy-agent: "^7.0.2"
  unhead: "^2.1.13"
  "@unhead/vue": "^2.1.13"
  happy-dom: ">=20.8.8"
  node-forge: "1.4.0"
  path-to-regexp: ">=8.4.0"
  # Pin to ^11.15.0 to close GHSA-6m6c-36f7-fhxh (Gantt-chart infinite-loop DoS), GHSA-87f9-hvmw-gh4p (CSS injection via configuration), GHSA-ghcm-xqfw-q4vr (HTML injection in classDef state diagrams), and GHSA-xcj9-5m2h-648r (CSS injection in classDefs). All four advisories fixed in 11.15.0. mermaid arrives here transitively via streamdown 1.6.11 (markdown streaming for the AI chat rendering pipeline).
  mermaid: "^11.15.0"
  # Pin vulnerable gRPC consumers to their patched minor releases for CVE-2026-48068 and CVE-2026-48069 while respecting transitive semver bounds.
  "@grpc/grpc-js@>=1.9.0 <1.9.16": "1.9.16"
  "@grpc/grpc-js@>=1.10.0 <1.10.12": "1.10.12"
  "@grpc/grpc-js@>=1.11.0 <1.11.4": "1.11.4"
  "@grpc/grpc-js@>=1.12.0 <1.12.7": "1.12.7"
  "@grpc/grpc-js@>=1.13.0 <1.13.5": "1.13.5"
  "@grpc/grpc-js@>=1.14.0 <1.14.4": "1.14.4"
  # Pin vulnerable shell-quote consumers to the first patched release for CVE-2026-9277.
  "shell-quote@>=1.1.0 <=1.8.3": "1.8.4"

patchedDependencies:
  "@react-native-community/datetimepicker@9.1.0": "patches/@react-native-community/datetimepicker@9.1.0.patch"
  "@react-native-google-signin/google-signin@16.1.2": "patches/@react-native-google-signin/google-signin@16.1.2.patch"
  '@react-native/gradle-plugin@0.85.3': patches/@react-native__gradle-plugin@0.85.3.patch
  "lottie-react-native@7.3.8": "patches/lottie-react-native@7.3.8.patch"
  "novel@1.0.2": "patches/novel@1.0.2.patch"
  "react-native@0.85.3": "patches/react-native@0.85.3.patch"
  "react-native-mmkv@4.3.1": "patches/react-native-mmkv@4.3.1.patch"
  "react-native-nitro-modules@0.35.9": "patches/react-native-nitro-modules@0.35.9.patch"
  "react-native-phone-number-input@2.1.0": "patches/react-native-phone-number-input@2.1.0.patch"
  "react-native-purchases@10.2.0": "patches/react-native-purchases@10.2.0.patch"
  "react-native-safe-area-context@5.8.0": "patches/react-native-safe-area-context@5.8.0.patch"
