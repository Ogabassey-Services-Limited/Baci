// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.google.gms:google-services:4.4.4'
    classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20'
    classpath('com.android.tools.build:gradle:9.1.0')
    classpath('com.facebook.react:react-native-gradle-plugin')
  }
}

allprojects {
  repositories {
    maven { url "${rootDir}/../../../node_modules/@react-native-async-storage/async-storage/android/local_repo" }
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

def configureAndroidSdkDefaults = { subproject ->
  def applySdkDefaults = {
    def android = subproject.extensions.findByName("android")
    if (android == null) {
      return
    }

    def compileSdkVersion = rootProject.ext.has("compileSdkVersion") ? rootProject.ext.get("compileSdkVersion") : 36
    def minSdkVersion = rootProject.ext.has("minSdkVersion") ? rootProject.ext.get("minSdkVersion") : 24
    def targetSdkVersion = rootProject.ext.has("targetSdkVersion") ? rootProject.ext.get("targetSdkVersion") : 36

    if (android.hasProperty("compileSdk") && !android.compileSdk) {
      android.compileSdk = compileSdkVersion
    }

    if (android.defaultConfig != null) {
      if (android.defaultConfig.hasProperty("minSdk") && android.defaultConfig.minSdk == null) {
        android.defaultConfig.minSdk = minSdkVersion
      }
      if (android.defaultConfig.hasProperty("targetSdk") && android.defaultConfig.targetSdk == null) {
        android.defaultConfig.targetSdk = targetSdkVersion
      }
    }
  }

  subproject.plugins.withId("com.android.application") {
    applySdkDefaults()
  }
  subproject.plugins.withId("com.android.library") {
    applySdkDefaults()
  }
}

subprojects { subproject ->
  configureAndroidSdkDefaults(subproject)
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
