// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
        classpath 'com.google.gms:google-services:4.4.1'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    // kotlin-gradle-plugin removed: AGP 9.x includes built-in Kotlin support
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    // async-storage ships a local AAR for its shared_storage module
    maven { url "$rootDir/../../../node_modules/@react-native-async-storage/async-storage/android/local_repo" }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
