name: pnpm install with incremental cache
description: Restore and save pnpm dependency and Turborepo caches with PR security boundaries.

inputs:
  store-dir:
    description: 'Base path for pnpm store; pnpm appends its current store version'
    required: false
    # Keep the default workspace-relative so actions/cache archives checkout-local paths.
    default: .pnpm-store
  install-command:
    description: 'Custom command to execute dependencies installation'
    required: false
    default: './.github/scripts/pnpm-install-with-retry.sh --frozen-lockfile --prefer-offline'

runs:
  using: composite
  steps:
    - name: Clean old pnpm setup directories
      shell: bash
      env:
        PNPM_SETUP_ROOT: ${{ runner.temp }}
      run: |
        # Keep active and recently completed jobs safe; release jobs time out well before 6 hours.
        find "$PNPM_SETUP_ROOT" \
          -mindepth 1 \
          -maxdepth 1 \
          -type d \
          -name 'setup-pnpm-*' \
          -mmin +360 \
          -exec rm -rf {} + 2>/dev/null || true

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "24"

    - name: Install pnpm
      id: setup_pnpm
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      with:
        dest: ${{ runner.temp }}/setup-pnpm-install-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

    # Strict split caching for pnpm content-addressable store
    - id: pnpm-store-cache
      name: Restore pnpm store cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ inputs.store-dir }}
        key: v2-${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          v2-${{ runner.os }}-${{ runner.arch }}-pnpm-store-

    - name: Configure pnpm store directory
      shell: bash
      env:
        PNPM_BIN_DIR: ${{ steps.setup_pnpm.outputs.bin_dest }}
        STORE_DIR: ${{ inputs.store-dir }}
      run: |
        set -euo pipefail

        if [ -z "$PNPM_BIN_DIR" ]; then
          echo "::error::pnpm/action-setup did not expose bin_dest"
          exit 1
        fi

        PNPM_CMD="$PNPM_BIN_DIR/pnpm"
        if [ ! -x "$PNPM_CMD" ]; then
          echo "::error::Unable to find pnpm executable at '$PNPM_CMD'"
          exit 1
        fi

        "$PNPM_CMD" config set store-dir "$STORE_DIR"
        echo "PNPM_STORE_DIR=$STORE_DIR" >> "$GITHUB_ENV"

    - name: Install Dependencies
      shell: bash
      run: ${{ inputs.install-command }}

    # Cache Save Engine: PR branches are strictly RESTORE-ONLY to prevent cache poisoning & save storage limit (10GB)
    - name: Save pnpm store cache (main branch only)
      if: >
        github.ref == 'refs/heads/main' &&
        github.event_name == 'push' &&
        steps.pnpm-store-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ inputs.store-dir }}
        key: ${{ steps.pnpm-store-cache.outputs.cache-primary-key }}
