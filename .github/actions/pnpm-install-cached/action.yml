name: pnpm install with incremental cache
description: Restore and save pnpm dependency and Turborepo caches with PR security boundaries.

inputs:
  store-dir:
    description: 'Path for pnpm store'
    required: false
    default: ~/.local/share/pnpm/store/v3
  turbo-cache-dir:
    description: 'Path for local Turborepo artifacts'
    required: false
    default: .turbo
  install-command:
    description: 'Custom command to execute dependencies installation'
    required: false
    default: 'pnpm install --frozen-lockfile --prefer-offline'

runs:
  using: composite
  steps:
    - name: Clean stale pnpm setup directory
      shell: bash
      run: rm -rf ~/setup-pnpm 2>/dev/null || true

    - name: Install pnpm
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      with:
        version: "11.5.0"

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "24"

    # Strict split caching for pnpm content-addressable store
    - id: pnpm-store-cache
      name: Restore pnpm store cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ inputs.store-dir }}
        key: v1-${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          v1-${{ runner.os }}-${{ runner.arch }}-pnpm-store-

    - name: Configure pnpm store directory
      shell: bash
      run: pnpm config set store-dir "${{ inputs.store-dir }}"

    # Split caching for local Turborepo artifacts
    - id: turbo-cache
      name: Restore Turborepo cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ inputs.turbo-cache-dir }}
        key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.ref_name }}-
          turbo-${{ runner.os }}-main-

    - name: Install Dependencies
      shell: bash
      env:
        pnpm_config_strict_dep_builds: 'false'
      run: ${{ inputs.install-command }}

    # Cache Save Engine: PR branches are strictly RESTORE-ONLY to prevent cache poisoning & save storage limit (10GB)
    - name: Save pnpm store cache (main branch only)
      if: >
        github.ref == 'refs/heads/main' &&
        github.event_name == 'push' &&
        steps.pnpm-store-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ inputs.store-dir }}
        key: ${{ steps.pnpm-store-cache.outputs.cache-primary-key }}

    - name: Save Turborepo cache (main branch only)
      if: >
        github.ref == 'refs/heads/main' &&
        github.event_name == 'push' &&
        steps.turbo-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ inputs.turbo-cache-dir }}
        key: ${{ steps.turbo-cache.outputs.cache-primary-key }}
