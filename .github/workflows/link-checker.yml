name: Link Checker

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # Runs every Monday at midnight
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  link-checker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          # Check all markdown, html, and ts/tsx files
          # Excludes: localhost, github.com, placeholders, template variables, CDN preconnects, API endpoints
          args: >-
            --verbose
            --no-progress
            './apps/web/**/*.md' './apps/web/**/*.html' './apps/web/**/*.tsx' './apps/web/**/*.ts'
            --exclude-path 'apps/web/src/**/*.test.ts'
            --exclude-path 'apps/web/src/**/*.test.tsx'
            --exclude-path 'apps/web/scripts'
            --exclude-path 'apps/web/supabase'
            --exclude-path 'apps/web/mcp-server'
            --exclude-path 'apps/web/node_modules'
            --exclude-path 'apps/web/.next'
            --exclude-path 'apps/web/out'
            --exclude-path 'apps/web/build'
            --exclude 'ogabassey'
            --exclude 'localhost|127\.0\.0\.1'
            --exclude 'github\.com'
            --exclude 'via\.placeholder\.com|example\.com|yourcdn\.com|yoursite\.com'
            --exclude '\$\{|%7B|%7D'
            --exclude 'VIDEO_ID|spreadsheetId|project_ref'
            --exclude 'base\.google\.com/ns'
            --exclude 'puckeditor\.com/demo'
            --exclude 'martinfowler\.com'
            --exclude 'supabase\.co/$'
            --exclude 'fonts\.googleapis\.com/$|fonts\.gstatic\.com/$|www\.gstatic\.com/$'
            --exclude 'generativelanguage\.googleapis\.com/$'
            --exclude 'google-analytics\.com/mp/collect'
            --exclude 'api\.pwnedpasswords\.com'
            --exclude 'api\.supabase\.com'
            --exclude 'firebase\.google\.com/docs/genkit'
            --exclude 'unsplash\.com/photo-'
            --exclude 'facebook\.com/sharer'
            --exclude 'ogabassey\.com'
            --exclude 'topship-staging\.africa|api-topship\.com'
            --exclude 'whogohost\.com'
            --exclude 'docs\.google\.com'
            --exclude 'api\.korapay\.com'
            --exclude 'store\.com'
            --exclude 'developers\.facebook\.com'
            --exclude 'baci\.app'
            --exclude 'theagilitysystems\.com'
            --exclude 'graph\.facebook\.com'
            --exclude 'apiideraos\.com'
            --exclude 'res\.cloudinary\.com/$'
            --exclude 'linkedin\.com/company'
            --exclude 'instagram\.com'
            --exclude 'medium\.com'
            --exclude 'openai\.com'
            --exclude 'npmjs\.com'
            --exclude 'paystack\.com/docs'
            --exclude 'business-api\.tiktok\.com'
            --exclude 'places\.googleapis\.com/v1'
            --exclude 'kuda-openapi\.kuda\.com'
            --exclude 'creditdirect\.ng'
            --exclude 'dashboard\.\$\{rootDomain\}'
            --exclude '^https://dashboard/'
            --exclude 'transparenttextures\.com'
            --exclude 'upload\.wikimedia\.org'
            --exclude 'ssl-product-images\.www8-hp\.com'
            --exclude 'adis\.ws'
            --exclude 'api\.zeptomail\.com'
            --exclude 'store\.storeimages\.cdn-apple\.com'
            --exclude 'korapay\.com'
            --exclude 'api\.mycover\.ai'
            --exclude 'image-us\.samsung\.com'
            --exclude 'p4-ofp\.static\.pub'
            --exclude 'i\.dell\.com'
            --exclude 'spendjuice\.com|api-sandbox\.spendjuice\.com'
            --exclude 'api\.vercel\.com'
            --exclude 'api\.paystack\.co'
            --exclude 'tronscan\.org'
            --exclude 'snowtrace\.io'
            --exclude 'supabase\.com/docs'
            --exclude 'exp\.host'
            --exclude 'usebaci\.com'
            --exclude 'developer\.mozilla\.org'
            --exclude 'schema\.org'
            --exclude 'w3\.org'
            --exclude 'https://api.credpal.com/.*'
            --exclude 'https://www.googletagservices.com/.*'
            --exclude 'googlesyndication\.com'
            --exclude 'doubleclick\.net'
            --exclude 'ep2\.adtrafficquality\.google'
            --exclude 'cdn\.ampproject\.org'
            --exclude 'tr\.snapchat\.com/v2/conversion'
            --exclude 'vendor-api(-staging)?\.jumia\.com'
            --exclude 'vendorcenter\.jumia\.com\.ng'
          # Fail action if broken links are found
          fail: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
