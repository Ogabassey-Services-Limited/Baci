name: Android Storefront Production Release

on:
  push:
    tags:
      - "v*-storefront"
  workflow_dispatch:
    inputs:
      version_code:
        description: "Play Store version code (must be higher than current production)"
        required: true
        type: string

concurrency:
  group: android-storefront-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "22"
  WORKING_DIR: apps/mobile-storefront
  # Offset added to github.run_number to produce unique version codes.
  # Bump this if you ever hit a "version code already used" error.
  VERSION_CODE_BASE: "0"

jobs:
  build-and-deploy:
    name: Build Storefront AAB & Upload to Play Store
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Cache Gradle
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.WORKING_DIR }}/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache Turborepo
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version code
        id: version
        shell: bash
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_RUN_NUMBER: ${{ github.run_number }}
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
        run: |
          if [ "$GH_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$VERSION_CODE_INPUT" ]; then
            VERSION_CODE="$VERSION_CODE_INPUT"
          elif [ "$GH_REF_TYPE" = "tag" ]; then
            VERSION_CODE="${GH_REF_NAME#v}"
            VERSION_CODE="${VERSION_CODE%-storefront}"
          else
            # Auto-bump: run_number + base offset to avoid version code collisions.
            VERSION_CODE=$(( GH_RUN_NUMBER + VERSION_CODE_BASE ))
          fi

          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid version code '$VERSION_CODE'. Use a positive integer."
            exit 1
          fi
          if [ "$VERSION_CODE" -gt 2147483647 ]; then
            echo "::error::Invalid version code '$VERSION_CODE'. Must be a positive integer <= 2147483647."
            exit 1
          fi

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Generate Android project via Expo prebuild
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CI: "1"
          ANDROID_VERSION_CODE: ${{ env.VERSION_CODE }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_API_URL: https://usebaci.com
          EXPO_PUBLIC_API_URL: https://usebaci.com
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: pnpm exec expo prebuild --platform android --clean

      - name: Decode keystore
        working-directory: ${{ env.WORKING_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty or not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Configure release signing
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          cat > android/app/signing-config.gradle <<'EOF2'
          android {
            signingConfigs {
              release {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF2

          echo "apply from: './signing-config.gradle'" >> android/app/build.gradle

      - name: Build Android App Bundle (storefront)
        working-directory: ${{ env.WORKING_DIR }}/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/${{ env.WORKING_DIR }}/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          GRADLE_ARGS="app:bundleRelease -x lint -x test --configure-on-demand --build-cache --no-daemon"
          # shellcheck disable=SC2086
          ./gradlew $GRADLE_ARGS

      - name: Upload AAB artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: storefront-app-release-${{ github.sha }}
          path: ${{ env.WORKING_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Upload to Google Play (staged rollout)
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ogabassey.store
          releaseFiles: ${{ env.WORKING_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          track: production
          status: inProgress
          userFraction: 0.1

      - name: Clean up keystore
        if: always()
        run: rm -f ${{ env.WORKING_DIR }}/android/app/release.keystore
