name: Android Storefront Production Release

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile-storefront/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
    tags:
      # Tag pushes bypass the paths filter above (GitHub Actions behaviour).
      - "v*-storefront"
  workflow_dispatch:
    inputs:
      version_code:
        description: "Play Store version code (must be higher than current production)"
        required: false
        type: string

concurrency:
  group: android-storefront-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "24"
  WORKING_DIR: apps/mobile-storefront
  # Offset added to github.run_number to avoid collisions with
  # version codes previously uploaded via EAS or earlier manual runs.
  VERSION_CODE_BASE: '10'

jobs:
  build-and-deploy:
    name: Build Storefront AAB & Upload to Play Store
    runs-on: baci-android
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Node 22+ type stripping breaks expo-modules-core.
      - name: Disable Node type stripping
        run: echo "NODE_OPTIONS=--no-strip-types" >> "$GITHUB_ENV"

      # VPS has persistent disk — pnpm store, Gradle caches, and Turbo cache
      # survive across runs. No actions/cache needed.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix Hermes compiler path
        # RN 0.83+ ships hermesc in the hermes-compiler package, but
        # Gradle still resolves it via react-native/sdks/hermesc/.
        # Create a symlink so the build finds the binary.
        run: |
          HERMESC_SRC="$GITHUB_WORKSPACE/node_modules/hermes-compiler/hermesc"
          HERMESC_DST="$GITHUB_WORKSPACE/node_modules/react-native/sdks/hermesc"
          if [ -d "$HERMESC_SRC" ] && [ ! -e "$HERMESC_DST" ]; then
            ln -s "$HERMESC_SRC" "$HERMESC_DST"
            chmod +x "$HERMESC_DST/linux64-bin/hermesc" 2>/dev/null || true
          fi

      - name: Resolve version code
        id: version
        shell: bash
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_RUN_NUMBER: ${{ github.run_number }}
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
          VERSION_CODE_BASE: ${{ env.VERSION_CODE_BASE }}
        run: |
          if [ "$GH_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$VERSION_CODE_INPUT" ]; then
            VERSION_CODE="$VERSION_CODE_INPUT"
          elif [ "$GH_REF_TYPE" = "tag" ]; then
            VERSION_CODE="${GH_REF_NAME#v}"
            VERSION_CODE="${VERSION_CODE%-storefront}"
          else
            # Auto-bump: run_number + base offset to avoid collisions with
            # previously uploaded version codes (EAS builds, earlier CI runs).
            VERSION_CODE=$(( GH_RUN_NUMBER + VERSION_CODE_BASE ))
          fi

          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid version code '$VERSION_CODE'. Use a positive integer (>=1)."
            exit 1
          fi
          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::Invalid version code '$VERSION_CODE'. Must be a positive integer <= 2100000000."
            exit 1
          fi

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Generate Android project via Expo prebuild
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CI: "1"
          ANDROID_VERSION_CODE: ${{ env.VERSION_CODE }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_API_URL: https://usebaci.com
          EXPO_PUBLIC_API_URL: https://usebaci.com
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: pnpm exec expo prebuild --platform android --clean

      - name: Pin Gradle wrapper to 9.4.0
        # RN 0.84 ships Gradle 9.0.0; pin to 9.4.0 for full Java 25 support.
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          if [ ! -f "$WRAPPER" ]; then
            echo "::error::Gradle wrapper properties not found at $WRAPPER"
            exit 1
          fi
          sed -E -i 's|gradle-[0-9][0-9.]+-[a-z]+\.zip|gradle-9.4.0-bin.zip|' "$WRAPPER"
          if ! grep -q "gradle-9.4.0-bin.zip" "$WRAPPER"; then
            echo "::error::Failed to pin Gradle wrapper to 9.4.0"
            cat "$WRAPPER"
            exit 1
          fi
          echo "Pinned Gradle wrapper to 9.4.0"

      - name: Fix splash screen resource reference
        # expo-splash-screen adds a windowSplashScreenAnimatedIcon style item
        # referencing @drawable/splashscreen_logo, but without a splash image
        # configured, the drawable is never created. The config plugin
        # (withNoSplashImage.js) removes it from styles.xml, but if Expo
        # regenerates it during prebuild, strip it here as a safety net.
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          STYLES="android/app/src/main/res/values/styles.xml"
          if [ -f "$STYLES" ] && grep -q "splashscreen_logo" "$STYLES"; then
            sed -i '/@drawable\/splashscreen_logo/d' "$STYLES"
            echo "Removed splashscreen_logo reference from styles.xml"
          fi

      - name: Decode keystore
        working-directory: ${{ env.WORKING_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_STOREFRONT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_STOREFRONT_KEYSTORE_BASE64 secret is empty or not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Configure release signing
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          # Inject release signingConfig into the existing signingConfigs block
          sed -i 's|signingConfigs {|signingConfigs {\n        release {\n            storeFile file("release.keystore")\n            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n        }|' android/app/build.gradle

          # Switch release buildType from debug signing to release signing
          sed -i 's|signingConfig signingConfigs.debug|signingConfig signingConfigs.release|' android/app/build.gradle

      - name: Build Android App Bundle (storefront)
        working-directory: ${{ env.WORKING_DIR }}/android
        env:
          GRADLE_OPTS: "-Xmx4g -XX:+UseZGC"
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/${{ env.WORKING_DIR }}/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STOREFRONT_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_STOREFRONT_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_STOREFRONT_KEY_PASSWORD }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_API_URL: https://usebaci.com
          EXPO_PUBLIC_API_URL: https://usebaci.com
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: |
          GRADLE_ARGS="app:bundleRelease -x lint -x lintVitalAnalyzeRelease -x test --configure-on-demand --build-cache --parallel --no-daemon"
          # shellcheck disable=SC2086
          ./gradlew $GRADLE_ARGS

      - name: Upload AAB artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: storefront-app-release-${{ github.sha }}
          path: ${{ env.WORKING_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Upload to Google Play (closed testing)
        if: success()
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ogabassey.store
          releaseFiles: ${{ env.WORKING_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          track: alpha
          status: completed

      - name: Clean up keystore
        if: always()
        run: rm -f ${{ env.WORKING_DIR }}/android/app/release.keystore
