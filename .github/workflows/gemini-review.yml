name: '🔎 Gemini Review'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-review-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  review:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Checkout repository'
        uses: 'actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd' # ratchet:actions/checkout@v6
        with:
          ref: '${{ github.event.pull_request.head.sha || format(''refs/pull/{0}/head'', github.event.issue.number) }}'

      - name: 'Require Gemini authentication'
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          GOOGLE_API_KEY: '${{ secrets.GOOGLE_API_KEY }}'
          USE_GCA: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          USE_VERTEX_AI: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
        run: |-
          set -euo pipefail

          if [[ -n "${GEMINI_API_KEY}" || -n "${GOOGLE_API_KEY}" || "${USE_GCA}" == 'true' || "${USE_VERTEX_AI}" == 'true' ]]; then
            exit 0
          fi

          echo 'Configure GEMINI_API_KEY (Google AI Studio) or Vertex/GCA auth before running Gemini review.' >&2
          exit 1

      - name: 'Build Gemini review context'
        id: 'review_context'
        env:
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          PR_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
        run: |-
          set -euo pipefail

          mkdir -p .gemini

          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          title="$(jq -r '.title' <<<"${pr_json}")"
          body="$(jq -r '.body // ""' <<<"${pr_json}")"
          base_ref="$(jq -r '.base.ref' <<<"${pr_json}")"
          head_ref="$(jq -r '.head.ref' <<<"${pr_json}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"

          files_json="$(
            gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
              --slurp
          )"
          diff_text="$(
            gh api \
              -H 'Accept: application/vnd.github.v3.diff' \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}"
          )"

          files_summary="$(
            jq -r \
              '
                flatten
                | .[]
                | "- \(.filename) [\(.status)] +\(.additions) / -\(.deletions)"
              ' \
              <<<"${files_json}"
          )"

          {
            printf 'Review GitHub pull request #%s.\n' "${PR_NUMBER}"
            printf 'Repository: %s\n' "${REPOSITORY}"
            printf 'Base branch: %s\n' "${base_ref}"
            printf 'Head branch: %s\n' "${head_ref}"
            printf 'Head SHA: %s\n' "${head_sha}"
            printf 'Title: %s\n\n' "${title}"
            printf 'PR description:\n%s\n\n' "${body:-"(empty)"}"
            printf 'Additional requester context:\n%s\n\n' "${ADDITIONAL_CONTEXT:-"(none)"}"
            printf 'Changed files:\n%s\n\n' "${files_summary:-"- No changed-file metadata returned."}"
            printf 'Unified diff:\n```diff\n'
            printf '%s\n' "${diff_text:0:180000}"
            if (( ${#diff_text} > 180000 )); then
              printf '\n[diff truncated at 180000 characters]\n'
            fi
            printf '```\n'
          } > .gemini/pr-review-context.md

          {
            printf 'head_sha=%s\n' "${head_sha}"
            printf 'context_path=%s\n' ".gemini/pr-review-context.md"
          } >> "${GITHUB_OUTPUT}"

      - name: 'Run Gemini pull request review'
        id: 'gemini_pr_review'
        uses: 'google-github-actions/run-gemini-cli@9dbec29a20fab3f35017a40ad0eb798a257d4d51' # ratchet:exclude
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: "${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite-preview' }}"
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-review'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "tools": {
                "core": [
                  "run_shell_command(cat)",
                  "run_shell_command(echo)",
                  "run_shell_command(find)",
                  "run_shell_command(grep)",
                  "run_shell_command(head)",
                  "run_shell_command(ls)",
                  "run_shell_command(tail)"
                ]
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              }
            }
          prompt: |-
            You are reviewing a GitHub pull request for the Baci repository.

            First read the prepared review context from `${{ steps.review_context.outputs.context_path }}` using `cat`.

            Return only concise Markdown for a GitHub PR review body. Do not call GitHub tools and do not modify files.

            Review contract:
            - Always return a review body. If there are no meaningful issues, say no significant issues were found.
            - Prioritize correctness, security, data safety, auth/tenant isolation, payment safety, regressions, and missing tests.
            - Enforce Baci rules: pnpm/Turborepo only, Biome not ESLint, React Compiler means no routine React.memo/useMemo/useCallback, Zod at API boundaries, auth first in protected routes, no select('*'), and append-only migrations.
            - For Next.js 16 and React 19, prefer Server Components, avoid client-side data waterfalls, keep uncached data behind Suspense where required, use next/image and next/font, and preserve storefront Core Web Vitals.
            - For Supabase changes, check RLS, scoped queries, explicit column selection, service-role isolation, and race conditions around read-modify-write flows.
            - For public storefront changes, check semantic HTML, metadata, JSON-LD, accessible labels, keyboard behavior, focus states, and themed CSS variables instead of hardcoded storefront colors.
            - Do not speculate beyond the PR diff and repository evidence. Do not produce broad style commentary when there is no concrete risk.
            - Use these sections in the posted review: Verdict, Findings, Suggested next steps. Findings must be flat bullets with severity and file path when possible.

      - name: 'Submit Gemini review'
        env:
          GEMINI_RESPONSE: '${{ steps.gemini_pr_review.outputs.summary }}'
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          HEAD_SHA: '${{ steps.review_context.outputs.head_sha }}'
          PR_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
        run: |-
          set -euo pipefail

          body="${GEMINI_RESPONSE}"

          if [[ -z "${body//[[:space:]]/}" ]]; then
            body="$(
              cat <<'EOF'
          ## Verdict
          Gemini completed but did not return a review body.

          ## Findings
          - low: No review findings were returned by Gemini.

          ## Suggested next steps
          Check the workflow logs for the Gemini CLI response.
EOF
            )"
          fi

          jq -n \
            --arg body "${body}" \
            --arg commit_id "${HEAD_SHA}" \
            '{
              event: "COMMENT",
              body: $body,
              commit_id: $commit_id
            }' \
            > "${RUNNER_TEMP}/gemini-review-submit.json"

          gh api \
            --method POST \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --input "${RUNNER_TEMP}/gemini-review-submit.json"
