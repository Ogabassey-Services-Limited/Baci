name: '🔎 Gemini Review'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-review-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  review:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Checkout repository'
        uses: 'actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd' # ratchet:actions/checkout@v6
        with:
          ref: '${{ github.event.pull_request.head.sha || format(''refs/pull/{0}/head'', github.event.issue.number) }}'

      - name: 'Require Gemini authentication'
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          GOOGLE_API_KEY: '${{ secrets.GOOGLE_API_KEY }}'
          USE_GCA: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          USE_VERTEX_AI: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
        run: |-
          set -euo pipefail

          if [[ -n "${GEMINI_API_KEY}" || -n "${GOOGLE_API_KEY}" || "${USE_GCA}" == 'true' || "${USE_VERTEX_AI}" == 'true' ]]; then
            exit 0
          fi

          echo 'Configure GEMINI_API_KEY (Google AI Studio) or Vertex/GCA auth before running Gemini review.' >&2
          exit 1

      - name: 'Run Gemini pull request review'
        id: 'gemini_pr_review'
        uses: 'google-github-actions/run-gemini-cli@9dbec29a20fab3f35017a40ad0eb798a257d4d51' # ratchet:exclude
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.pull_request.body || github.event.issue.body }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: "${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}"
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-review'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "tools": {
                "core": [
                  "run_shell_command(cat)",
                  "run_shell_command(echo)",
                  "run_shell_command(find)",
                  "run_shell_command(grep)",
                  "run_shell_command(head)",
                  "run_shell_command(ls)",
                  "run_shell_command(tail)"
                ]
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server@sha256:a1d43076a36638ee24520fd6e83c3905ae41bc9850179081df1de2ba3a7afae0"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "pull_request_read",
                    "pull_request_review_write"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}"
                  }
                }
              }
            }
          prompt: |-
            /gemini-review

            Review contract:
            - Always submit a GitHub PR review. If there are no meaningful issues, submit a concise review that says no significant issues were found.
            - Prioritize correctness, security, data safety, auth/tenant isolation, payment safety, regressions, and missing tests.
            - Enforce Baci rules: pnpm/Turborepo only, Biome not ESLint, React Compiler means no routine React.memo/useMemo/useCallback, Zod at API boundaries, auth first in protected routes, no select('*'), and append-only migrations.
            - For Next.js 16 and React 19, prefer Server Components, avoid client-side data waterfalls, keep uncached data behind Suspense where required, use next/image and next/font, and preserve storefront Core Web Vitals.
            - For Supabase changes, check RLS, scoped queries, explicit column selection, service-role isolation, and race conditions around read-modify-write flows.
            - For public storefront changes, check semantic HTML, metadata, JSON-LD, accessible labels, keyboard behavior, focus states, and themed CSS variables instead of hardcoded storefront colors.
            - Do not speculate beyond the PR diff and repository evidence. Do not produce broad style commentary when there is no concrete risk.
            - Use these sections in the posted review: Verdict, Findings, Suggested next steps. Findings must be flat bullets with severity and file path when possible.

            ${{ inputs.additional_context }}
