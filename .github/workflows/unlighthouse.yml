name: "Holistic SEO & Performance (Unlighthouse)"

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: unlighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unlighthouse:
    name: SEO & Core Web Vitals Audit
    runs-on: baci-deploy
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Ensure Chromium is available
        # puppeteer-core (used by Unlighthouse) requires a Chrome/Chromium
        # binary. Install it if missing on the VPS.
        run: |
          if command -v chromium-browser &>/dev/null; then
            echo "PUPPETEER_EXECUTABLE_PATH=$(command -v chromium-browser)" >> "$GITHUB_ENV"
          elif command -v chromium &>/dev/null; then
            echo "PUPPETEER_EXECUTABLE_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable &>/dev/null; then
            echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome &>/dev/null; then
            echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            echo "No system Chrome found — downloading via puppeteer"
            if ! pnpm exec puppeteer browsers install chrome; then
              echo "::error::Failed to download Chrome via puppeteer"
              exit 1
            fi
            CHROME_PATH=$(find "$HOME/.cache/puppeteer" -type f -name "chrome" -perm -u+x 2>/dev/null | head -1)
            if [ -z "$CHROME_PATH" ]; then
              echo "::error::Failed to locate downloaded Chrome binary"
              exit 1
            fi
            echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          fi

      # VPS has persistent disk — Next.js build cache survives across runs.

      - name: Build Next.js App
        run: pnpm turbo build --filter=@baci/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Skip strict lint/typecheck here as they run in other jobs
          NEXT_TELEMETRY_DISABLED: 1

      - name: Start Production Server
        # Run in background from apps/web
        working-directory: apps/web
        run: pnpm start &
        env:
          PORT: 3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Wait for Server
        run: pnpm exec wait-on http://localhost:3000 --timeout 60000

      - name: Run Unlighthouse Audit
        # Run audit against local server.
        # --no-sitemap prevents Unlighthouse from discovering https:// URLs
        # from the sitemap (the local server only speaks HTTP).
        run: pnpm exec unlighthouse-ci --site http://localhost:3000 --no-sitemap --reporter json
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ env.PUPPETEER_EXECUTABLE_PATH }}

      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unlighthouse-report
          path: .unlighthouse
          retention-days: 30
