name: "Holistic SEO & Performance (Unlighthouse)"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unlighthouse:
    name: SEO & Core Web Vitals Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      
      - name: Install dependencies
        run: pnpm install

      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Build Next.js App
        run: pnpm turbo build --filter=@baci/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Skip strict lint/typecheck here as they run in other jobs
          NEXT_TELEMETRY_DISABLED: 1

      - name: Start Production Server
        # Run in background from apps/web
        working-directory: apps/web
        run: pnpm start &
        env:
          PORT: 3000

      - name: Wait for Server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Unlighthouse Audit
        # Run audit against local server
        run: npx @unlighthouse/cli --site http://localhost:3000 --ci --reporter jsonHtml
        
      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unlighthouse-report
          path: .unlighthouse
          retention-days: 30
