name: "Holistic SEO & Performance (Unlighthouse)"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unlighthouse:
    name: SEO & Core Web Vitals Audit
    runs-on: baci-vps
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      # VPS has persistent disk — Next.js build cache survives across runs.

      - name: Build Next.js App
        run: pnpm turbo build --filter=@baci/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Skip strict lint/typecheck here as they run in other jobs
          NEXT_TELEMETRY_DISABLED: 1

      - name: Start Production Server
        # Run in background from apps/web
        working-directory: apps/web
        run: pnpm start &
        env:
          PORT: 3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Wait for Server
        run: pnpm exec wait-on http://localhost:3000 --timeout 60000

      - name: Run Unlighthouse Audit
        # Run audit against local server.
        # --no-sitemap prevents Unlighthouse from discovering https:// URLs
        # from the sitemap (the local server only speaks HTTP).
        run: pnpm exec unlighthouse-ci --site http://localhost:3000 --no-sitemap --reporter json

      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: unlighthouse-report
          path: .unlighthouse
          retention-days: 30
