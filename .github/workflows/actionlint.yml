name: Actionlint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check for deprecated runner labels
        run: |
          # Fail if any workflow uses the retired baci-vps runner label.
          # New runners: baci-android, baci-deploy, baci-lighthouse
          if grep -rn 'runs-on:.*baci-vps' .github/workflows/ --include='*.yml' --exclude='actionlint.yml'; then
            echo "::error::Deprecated runner label 'baci-vps' found. Use baci-android, baci-deploy, or baci-lighthouse instead."
            exit 1
          fi

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
