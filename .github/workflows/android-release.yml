name: Android Production Release

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile-admin/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
    tags:
      # Tag pushes bypass the paths filter above (GitHub Actions behaviour).
      - 'v*-admin'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code override (leave empty for auto)'
        required: false
        type: string

concurrency:
  # Shared self-hosted runner serialization prevents pnpm store corruption.
  group: baci-android-runner
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '24'
  PNPM_STORE_DIR: ${{ github.workspace }}/.pnpm-store
  WORKING_DIR: apps/mobile-admin
  # Offset added to github.run_number to avoid collisions with
  # version codes previously uploaded via EAS (1-9) and earlier runs (10).
  VERSION_CODE_BASE: '10'

jobs:
  build-and-deploy:
    name: Build AAB & Upload to Play Store
    runs-on: baci-android
    # Cross-workflow VPS mutex — separate from `vps-deploy-build` to avoid
    # silent-pending-cancel when 3+ heavy jobs queue against a single group
    # (GHA only allows 1 running + 1 pending; a 3rd arrival evicts the
    # pending one regardless of `cancel-in-progress: false`). Admin and
    # storefront Android share `vps-android-build` so they serialise against
    # each other but can run concurrently with deploy — the collision surfaces
    # as a visible OOM/retry rather than a silently cancelled Play Store release.
    concurrency:
      group: vps-android-build
      cancel-in-progress: false
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        # standalone: true bypasses the npm install path. `dest` gives each job
        # its own pnpm install location instead of the shared user-level
        # ~/setup-pnpm/ — without it, concurrent jobs on the same VPS user race
        # each other's downloads and leave the binary half-written, manifesting
        # as `pnpm: 1: This: not found` exit 127 (runs 25461414210, 25467270212).
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          standalone: true
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006

      - name: Configure pnpm store directory
        uses: ./.github/actions/setup-pnpm-store
        with:
          store-dir: ${{ env.PNPM_STORE_DIR }}

      # Node 22+ type stripping breaks expo-modules-core.
      - name: Disable Node type stripping
        run: echo "NODE_OPTIONS=--no-strip-types" >> "$GITHUB_ENV"

      # VPS has persistent disk — pnpm store, Gradle caches, and Turbo cache
      # survive across runs. No actions/cache needed.

      - name: Install dependencies
        run: .github/scripts/pnpm-install-with-retry.sh --frozen-lockfile

      - name: Fix Hermes compiler path
        # RN 0.83+ ships hermesc in the hermes-compiler package, but
        # Gradle still resolves it via react-native/sdks/hermesc/.
        # Create a symlink so the build finds the binary.
        run: |
          HERMESC_SRC="$GITHUB_WORKSPACE/node_modules/hermes-compiler/hermesc"
          HERMESC_DST="$GITHUB_WORKSPACE/node_modules/react-native/sdks/hermesc"
          if [ -d "$HERMESC_SRC" ] && [ ! -e "$HERMESC_DST" ]; then
            ln -s "$HERMESC_SRC" "$HERMESC_DST"
            chmod +x "$HERMESC_DST/linux64-bin/hermesc" 2>/dev/null || true
          fi

      - name: Resolve version code
        id: version
        shell: bash
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_RUN_NUMBER: ${{ github.run_number }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          VERSION_CODE_BASE: ${{ env.VERSION_CODE_BASE }}
        run: |
          if [ "$GH_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION_CODE" ]; then
            VERSION_CODE="$INPUT_VERSION_CODE"
          elif [ "$GH_REF_TYPE" = "tag" ]; then
            VERSION_CODE="${GITHUB_REF_NAME#v}"
            VERSION_CODE="${VERSION_CODE%-admin}"
          else
            # Auto-bump: run_number + base offset to avoid collisions with
            # previously uploaded version codes (EAS builds, earlier CI runs).
            VERSION_CODE=$(( GH_RUN_NUMBER + VERSION_CODE_BASE ))
          fi

          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid version code '$VERSION_CODE'. Use a positive integer (>=1)."
            exit 1
          fi
          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::Invalid version code '$VERSION_CODE'. Must be a positive integer <= 2100000000."
            exit 1
          fi

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Materialize Firebase Android config
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_ADMIN_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            umask 077
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json
            chmod 600 google-services.json
            echo "Materialized google-services.json from ANDROID_ADMIN_GOOGLE_SERVICES_JSON_BASE64"
          elif [ -f google-services.json ]; then
            echo "ANDROID_ADMIN_GOOGLE_SERVICES_JSON_BASE64 not set; using tracked google-services.json"
          else
            echo "::error::Missing apps/mobile-admin/google-services.json and ANDROID_ADMIN_GOOGLE_SERVICES_JSON_BASE64 secret"
            exit 1
          fi

      - name: Generate Android project via Expo prebuild
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CI: "1"
          ANDROID_VERSION_CODE: ${{ env.VERSION_CODE }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_API_URL: https://usebaci.com
          EXPO_PUBLIC_API_URL: https://usebaci.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_REVENUECAT_API_KEY_ANDROID: ${{ secrets.EXPO_PUBLIC_REVENUECAT_API_KEY_ANDROID }}
        run: pnpm exec expo prebuild --platform android --clean

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty or not set"
            exit 1
          fi
          KEYSTORE_PATH="${{ runner.temp }}/release.keystore"
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_ADMIN_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build Android App Bundle
        working-directory: ${{ env.WORKING_DIR }}/android
        env:
          GRADLE_OPTS: "-Xmx4g"
          ANDROID_KEYSTORE_FILE: ${{ env.ANDROID_ADMIN_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_API_URL: https://usebaci.com
          EXPO_PUBLIC_API_URL: https://usebaci.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_REVENUECAT_API_KEY_ANDROID: ${{ secrets.EXPO_PUBLIC_REVENUECAT_API_KEY_ANDROID }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: ./gradlew app:bundleRelease -x lint -x test --configure-on-demand --build-cache --parallel --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release-${{ github.sha }}
          path: ${{ env.WORKING_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Guard Google Play upload against stale main builds
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: upload_guard
        run: |
          CURRENT_MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$CURRENT_MAIN_SHA" ]; then
            echo "::error::Unable to determine current main HEAD"
            exit 1
          fi

          if [ "${GITHUB_SHA}" = "$CURRENT_MAIN_SHA" ]; then
            echo "allow_upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "allow_upload=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Google Play upload because this run is not for the current main HEAD."
          fi
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload to Google Play (full production rollout)
        if: success() && (github.event_name != 'push' || github.ref != 'refs/heads/main' || steps.upload_guard.outputs.allow_upload == 'true')
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ogabassey.baci
          releaseFiles: ${{ env.WORKING_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          track: production
          status: completed

      - name: Clean up keystore
        if: always()
        run: |
          rm -f "${{ env.ANDROID_ADMIN_KEYSTORE_FILE }}"
          if ! git -C ${{ github.workspace }} ls-files --error-unmatch ${{ env.WORKING_DIR }}/google-services.json >/dev/null 2>&1; then
            rm -f ${{ env.WORKING_DIR }}/google-services.json
          fi
          rm -f ${{ env.WORKING_DIR }}/android/app/google-services.json
