name: Deploy to Vercel

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  changes:
    # Lightweight job (just git diff) — runs on GitHub-hosted to keep
    # fork/Dependabot PR code off the self-hosted VPS entirely.
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'biome.json'

  deploy-production:
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: baci-deploy
    timeout-minutes: 20
    env:
      BLOG_SMOKE_BASE_URL: ${{ vars.BLOG_SMOKE_BASE_URL || 'https://ogabassey.com' }}
      BLOG_SMOKE_TAG: blog-posts
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Fix OOM error on runner
      NODE_OPTIONS: "--max_old_space_size=8192"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Clean stale pnpm setup directory
        run: rm -rf ~/setup-pnpm 2>/dev/null || true
      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          # No cache: "pnpm" — the store is nuked each run to fix cross-runner
          # issues, so caching it causes Post Run path validation errors.
      - name: Reset pnpm store to fix cross-runner install issues
        run: |
          export PNPM_STORE_DIR="${RUNNER_TEMP}/pnpm-store"
          rm -rf "${PNPM_STORE_DIR}" || true
          pnpm config set store-dir "${PNPM_STORE_DIR}"
      - run: .github/scripts/pnpm-install-with-retry.sh --frozen-lockfile
      - run: pnpm dlx vercel pull --yes --environment=production --token="${{ env.VERCEL_TOKEN }}"
      - run: pnpm dlx vercel build --yes --prod --token="${{ env.VERCEL_TOKEN }}"
      # IMPORTANT: --archive=tgz is required to prevent Vercel upload rate limiting.
      # Do NOT remove it — without it, each deploy uploads thousands of individual files.
      - name: Deploy to Vercel (with retry)
        run: .github/scripts/deploy-with-retry.sh pnpm dlx vercel deploy --yes --prebuilt --prod --archive=tgz --token="${{ env.VERCEL_TOKEN }}"
      - name: Prepare storefront blog smoke checker
        run: |
          cat > "${RUNNER_TEMP}/blog-smoke-check.mjs" <<'NODE'
          const baseUrl = process.env.BLOG_SMOKE_BASE_URL;
          const listUrl = new URL('/blog', baseUrl).toString();
          const failureMarkers = [
            'NEXT_HTTP_ERROR_FALLBACK;404',
            '<title>Post Not Found</title>',
          ];
          const sampleSize = 2;
          const timeoutMs = 30000;

          async function fetchText(url) {
            const response = await fetch(url, {
              headers: { 'user-agent': 'baci-deploy-blog-smoke-check' },
              signal: AbortSignal.timeout(timeoutMs),
            });

            if (!response.ok) {
              throw new Error(`Smoke check request failed for ${url}: HTTP ${response.status}`);
            }

            return response.text();
          }

          function assertHealthy(url, html) {
            const marker = failureMarkers.find((candidate) => html.includes(candidate));

            if (marker) {
              throw new Error(`Smoke check found stale 404 marker for ${url}: ${marker}`);
            }
          }

          function getDetailUrls(listingHtml) {
            const detailUrls = new Set();
            const escapedBaseUrl = baseUrl.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const absoluteUrlPattern = new RegExp(
              `${escapedBaseUrl}/blog/([a-z0-9][a-z0-9-]*)`,
              'gi'
            );
            const relativeHrefPattern = /href="\/blog\/([a-z0-9][a-z0-9-]*)/gi;

            for (const pattern of [absoluteUrlPattern, relativeHrefPattern]) {
              for (const match of listingHtml.matchAll(pattern)) {
                const slug = match[1]?.toLowerCase();

                if (!slug || slug === 'feed' || slug === 'sitemap' || slug.endsWith('.xml')) {
                  continue;
                }

                detailUrls.add(new URL(`/blog/${slug}`, baseUrl).toString());

                if (detailUrls.size >= sampleSize) {
                  return [...detailUrls];
                }
              }
            }

            return [...detailUrls];
          }

          async function main() {
            // Warm-up: absorb cold-start cost before asserting (best-effort)
            console.log('Warming up blog listing...');
            try { await fetchText(listUrl); } catch {}

            const listingHtml = await fetchText(listUrl);
            assertHealthy(listUrl, listingHtml);

            const detailUrls = getDetailUrls(listingHtml);

            if (detailUrls.length === 0) {
              throw new Error(`Smoke check could not find any blog detail URLs on ${listUrl}`);
            }

            // Warm up detail URLs in parallel (best-effort)
            console.log(`Warming up ${detailUrls.length} blog detail URLs...`);
            await Promise.allSettled(detailUrls.map((u) => fetchText(u)));

            console.log(`Smoke checking ${detailUrls.length} blog detail URLs from ${listUrl}`);

            for (const detailUrl of detailUrls) {
              const detailHtml = await fetchText(detailUrl);
              assertHealthy(detailUrl, detailHtml);
              console.log(`Verified ${detailUrl}`);
            }
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exit(1);
          });
          NODE
      - name: Smoke test storefront blog
        id: storefront-blog-smoke
        continue-on-error: true
        run: node "${RUNNER_TEMP}/blog-smoke-check.mjs"
      - name: Invalidate storefront blog cache tag
        if: ${{ steps.storefront-blog-smoke.outcome == 'failure' }}
        run: pnpm dlx vercel cache invalidate --tag "${{ env.BLOG_SMOKE_TAG }}" --token="${{ env.VERCEL_TOKEN }}" --yes
      - name: Wait for cache invalidation to propagate
        if: ${{ steps.storefront-blog-smoke.outcome == 'failure' }}
        run: sleep 10
      - name: Re-run storefront blog smoke test after tag invalidate
        id: storefront-blog-smoke-after-invalidate
        if: ${{ steps.storefront-blog-smoke.outcome == 'failure' }}
        continue-on-error: true
        run: node "${RUNNER_TEMP}/blog-smoke-check.mjs"
      - name: Hard purge storefront blog cache tag
        if: ${{ steps.storefront-blog-smoke.outcome == 'failure' && steps.storefront-blog-smoke-after-invalidate.outcome == 'failure' }}
        run: pnpm dlx vercel cache dangerously-delete --tag "${{ env.BLOG_SMOKE_TAG }}" --token="${{ env.VERCEL_TOKEN }}" --yes
      - name: Wait for cache purge to propagate
        if: ${{ steps.storefront-blog-smoke.outcome == 'failure' && steps.storefront-blog-smoke-after-invalidate.outcome == 'failure' }}
        run: sleep 10
      - name: Re-run storefront blog smoke test after hard purge
        id: storefront-blog-smoke-after-delete
        if: ${{ steps.storefront-blog-smoke.outcome == 'failure' && steps.storefront-blog-smoke-after-invalidate.outcome == 'failure' }}
        continue-on-error: true
        run: node "${RUNNER_TEMP}/blog-smoke-check.mjs"
      - name: Fail production deploy when storefront blog is still unhealthy
        if: ${{ steps.storefront-blog-smoke.outcome == 'failure' && steps.storefront-blog-smoke-after-invalidate.outcome == 'failure' && steps.storefront-blog-smoke-after-delete.outcome == 'failure' }}
        run: |
          echo "Storefront blog smoke check failed after cache recovery attempts."
          exit 1
