name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # Only cancel in-progress for PRs (previews). Production deploys run to completion
  # to avoid the cascade-cancel problem where rapid merges kill every deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  changes:
    # Lightweight job (just git diff) — runs on GitHub-hosted to keep
    # fork/Dependabot PR code off the self-hosted VPS entirely.
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'biome.json'

  deploy-production:
    needs: [changes]
    if: github.event_name == 'push' && needs.changes.outputs.web == 'true'
    runs-on: baci-deploy
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Clean stale pnpm setup directory
        run: rm -rf ~/setup-pnpm 2>/dev/null || true
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm dlx vercel@latest pull --yes --environment=production --token="${{ env.VERCEL_TOKEN }}"
      - run: pnpm dlx vercel@latest build --yes --prod --token="${{ env.VERCEL_TOKEN }}"
      # IMPORTANT: --archive=tgz is required to prevent Vercel upload rate limiting.
      # Do NOT remove it — without it, each deploy uploads thousands of individual files.
      - name: Deploy to Vercel (with retry)
        run: .github/scripts/deploy-with-retry.sh pnpm dlx vercel@latest deploy --yes --prebuilt --prod --archive=tgz --token="${{ env.VERCEL_TOKEN }}"

  deploy-preview:
    needs: [changes]
    # Skip for forks (different repo) AND Dependabot (actor check).
    # Both lack access to VERCEL_TOKEN — deploy steps would hard-fail.
    if: >-
      github.event_name == 'pull_request'
      && needs.changes.outputs.web == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: baci-deploy
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Clean stale pnpm setup directory
        run: rm -rf ~/setup-pnpm 2>/dev/null || true
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install
      - name: Pull Vercel Environment Information
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: pnpm dlx vercel@latest pull --yes --environment=preview --token="${{ env.VERCEL_TOKEN }}"
      - name: Build Project Artifacts
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: pnpm dlx vercel@latest build --yes --token="${{ env.VERCEL_TOKEN }}"
      # IMPORTANT: --archive=tgz is required to prevent Vercel upload rate limiting.
      # Do NOT remove it — without it, each deploy uploads thousands of individual files.
      - name: Deploy to Vercel (with retry)
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: .github/scripts/deploy-with-retry.sh pnpm dlx vercel@latest deploy --yes --prebuilt --archive=tgz --token="${{ env.VERCEL_TOKEN }}"
