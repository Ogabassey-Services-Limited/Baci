name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # Only cancel in-progress for PRs (previews). Production deploys run to completion
  # to avoid the cascade-cancel problem where rapid merges kill every deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  changes:
    # Lightweight job (just git diff) — runs on GitHub-hosted to keep
    # fork/Dependabot PR code off the self-hosted VPS entirely.
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'biome.json'

  deploy-production:
    needs: [changes]
    if: github.event_name == 'push' && needs.changes.outputs.web == 'true'
    runs-on: baci-deploy
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Fix OOM error on runner
      NODE_OPTIONS: "--max_old_space_size=8192"
      # Keep the pnpm content-addressable store outside the action install dir.
      PNPM_STORE_DIR: ${{ runner.temp }}/pnpm-store
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Clean stale pnpm setup directory
        run: rm -rf ~/setup-pnpm 2>/dev/null || true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Reset pnpm store to fix cross-runner install issues
        run: |
          rm -rf "${PNPM_STORE_DIR}" || true
          pnpm config set store-dir "${PNPM_STORE_DIR}"
      - run: pnpm install
      - run: pnpm dlx vercel pull --yes --environment=production --token="${{ env.VERCEL_TOKEN }}"
      - run: pnpm dlx vercel build --yes --prod --token="${{ env.VERCEL_TOKEN }}"
      # IMPORTANT: --archive=tgz is required to prevent Vercel upload rate limiting.
      # Do NOT remove it — without it, each deploy uploads thousands of individual files.
      - name: Deploy to Vercel (with retry)
        run: .github/scripts/deploy-with-retry.sh pnpm dlx vercel deploy --yes --prebuilt --prod --archive=tgz --token="${{ env.VERCEL_TOKEN }}"

  deploy-preview:
    needs: [changes]
    # Skip for forks (different repo) AND Dependabot (actor check).
    # Both lack access to VERCEL_TOKEN — deploy steps would hard-fail.
    if: >-
      github.event_name == 'pull_request'
      && needs.changes.outputs.web == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: baci-deploy
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Fix OOM error on runner
      NODE_OPTIONS: "--max_old_space_size=8192"
      # Keep the pnpm content-addressable store outside the action install dir.
      PNPM_STORE_DIR: ${{ runner.temp }}/pnpm-store
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Clean stale pnpm setup directory
        run: rm -rf ~/setup-pnpm 2>/dev/null || true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Reset pnpm store to fix cross-runner install issues
        run: |
          rm -rf "${PNPM_STORE_DIR}" || true
          pnpm config set store-dir "${PNPM_STORE_DIR}"
      - run: pnpm install
      - name: Pull Vercel Environment Information
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: pnpm dlx vercel pull --yes --environment=preview --token="${{ env.VERCEL_TOKEN }}"
      - name: Build Project Artifacts
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: pnpm dlx vercel build --yes --token="${{ env.VERCEL_TOKEN }}"
      # IMPORTANT: --archive=tgz is required to prevent Vercel upload rate limiting.
      # Do NOT remove it — without it, each deploy uploads thousands of individual files.
      - name: Deploy to Vercel (with retry)
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: .github/scripts/deploy-with-retry.sh pnpm dlx vercel deploy --yes --prebuilt --archive=tgz --token="${{ env.VERCEL_TOKEN }}"
