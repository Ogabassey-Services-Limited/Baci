# Diff Guardian — a QUORUM gate over the AI code reviewers.
#
# WHY THIS EXISTS
# The repo already runs several AI reviewers (Gemini, Jules, Claude, CodeRabbit,
# Codex). Each is good but each, alone, occasionally (a) raises a false-positive
# you can't easily refute, or (b) crashes/times out. If any single reviewer is a
# *required* merge gate, one bad call or one outage blocks every merge.
#
# Diff Guardian fixes that by VOTING: it watches the other reviewers' pass/fail
# results on the PR and reports ONE status — and it only BLOCKS the merge when a
# QUORUM of reviewers agree there is a problem. So:
#   - one reviewer false-positives  -> does NOT block (others didn't agree)
#   - one reviewer is down/flaky     -> does NOT block (it just abstains)
#   - two+ reviewers flag a problem  -> BLOCKS (real signal, worth a human look)
#
# It re-implements no model calls; it only tallies the existing reviewers'
# statuses, so it's cheap and can't itself hallucinate.
#
# HOW TO ADOPT (branch protection, main):
#   1. Let this run on a few PRs first and confirm the `Diff Guardian` status
#      appears and matches your expectation.
#   2. Then in main's required status checks: ADD `Diff Guardian`, and REMOVE the
#      individual `Gemini review` / `Jules review` from *required* (they keep
#      running + commenting, just no longer block on their own). Diff Guardian
#      becomes the single AI gate. Keep `Build` + `Quality Gate` (tests) required.
#   3. Escape hatch: add the `bypass-ai-gate` label to a PR to force this green
#      (same label the individual reviewers already honor).
#
# TUNING: edit VOTERS (the reviewers to tally) and BLOCK_QUORUM (how many must
# agree to block) in the env block below. With 2 voters, BLOCK_QUORUM=2 means
# "both must agree to block" (lenient — favors not-blocking). Add `Claude review`
# as a 3rd voter (once it auto-runs + sets a status) and set BLOCK_QUORUM=2 for a
# true majority.
#
# NOTE (merge queue): the voter reviewers run on `pull_request`, not
# `merge_group`. If/when you enable the merge queue, add `merge_group` triggers
# to the voters AND here, or this gate will just pass on the queue.

name: Diff Guardian

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [Gemini Code Review, Jules PR Review]
    types: [completed]

permissions:
  contents: read
  statuses: write
  checks: read
  pull-requests: read

concurrency:
  group: diff-guardian-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  guardian:
    name: Diff Guardian
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (
          contains(github.event.comment.body, '@gemini-cli /review') ||
          contains(github.event.comment.body, '/jules deep review')
        ) &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.pull_requests[0].number != null
      )
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Tally AI reviewers and gate by quorum
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || '' }}
          PR: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.issue.number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          # The reviewers to tally (commit-status context or check-run names), pipe-separated.
          VOTERS: 'Gemini review|Jules review'
          # How many voters must report a FAILURE for Diff Guardian to BLOCK.
          BLOCK_QUORUM: '2'
          # How long to wait for actively-running voters before leaving the
          # Diff Guardian commit status pending. Jules fast reviews can poll for
          # 7200s; the workflow_run trigger below re-tallies when reviewers
          # complete so a late failure can still flip this status before merge.
          POLL_TIMEOUT_SECONDS: '7200'
          # Missing checks are different from active pending checks. Give the
          # reviewer workflows a short window to create their check runs/statuses
          # before treating missing voters as abstentions.
          MISSING_GRACE_SECONDS: '300'
          # Fork PRs do not get automatic same-repo reviewer votes. Require at
          # least one trusted manual voter result before this quorum gate can pass.
          MIN_FORK_REPORTED: '1'
        run: |
          set -euo pipefail

          set_status() { # state, description
            gh api -X POST "repos/$REPO/statuses/$SHA" \
              -f state="$1" \
              -f context='Diff Guardian' \
              -f description="$2" \
              -f target_url="https://github.com/$REPO/actions/runs/${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          }

          if [ -z "${PR:-}" ]; then
            echo "::notice::Diff Guardian trigger has no associated PR; nothing to tally."
            exit 0
          fi

          # Escape hatch: explicit human override.
          pr_json="$(gh api "repos/$REPO/pulls/$PR")"
          current_sha="$(printf '%s' "$pr_json" | jq -r '.head.sha')"
          if [ -z "${SHA:-}" ]; then
            SHA="$current_sha"
          fi
          if [ "$SHA" != "$current_sha" ]; then
            echo "::notice::Ignoring stale Diff Guardian trigger for $SHA; PR #$PR now points at $current_sha."
            exit 0
          fi
          head_repo="$(printf '%s' "$pr_json" | jq -r '.head.repo.full_name')"
          has_bypass="$(printf '%s' "$pr_json" | jq -r '[.labels[].name] | index("bypass-ai-gate") != null')"
          is_fork_pr="false"
          if [ "$head_repo" != "$REPO" ]; then
            is_fork_pr="true"
          fi

          if [ "$has_bypass" = "true" ]; then
            echo "::notice::'bypass-ai-gate' label present — Diff Guardian passing without tallying."
            set_status success "Bypassed via bypass-ai-gate label"
            exit 0
          fi
          # Removing the bypass label does not re-run the individual voters.
          # Fail closed until a new commit re-runs them, otherwise stale
          # bypass-success votes can be misread as real review passes.
          if [ "$EVENT_ACTION" = "unlabeled" ] && [ "$EVENT_LABEL" = "bypass-ai-gate" ]; then
            echo "::error::'bypass-ai-gate' label was removed. Push a new commit to re-run AI reviewers before Diff Guardian can tally them."
            set_status failure "Push a new commit after removing bypass-ai-gate"
            exit 1
          fi

          # Pipe-separated -> newline list of voter contexts.
          voters="$(printf '%s\n' "$VOTERS" | tr '|' '\n' | sed '/^$/d')"
          voter_count="$(printf '%s\n' "$voters" | grep -c .)"
          echo "Voters ($voter_count): $(printf '%s' "$VOTERS")  |  block quorum: $BLOCK_QUORUM"

          set_status pending "Waiting for AI reviewers to finish…"

          started_at="$(date +%s)"
          deadline=$(( started_at + POLL_TIMEOUT_SECONDS ))
          missing_grace_deadline=$(( started_at + MISSING_GRACE_SECONDS ))
          # A voter can report either as a commit status (external services) or
          # as a check run (GitHub Actions). Gemini currently reports both; Jules
          # currently reports only a check run. Read both current GitHub API
          # surfaces so a check-only voter cannot be mistaken as missing.
          status_state() {
            printf '%s' "$1" | jq -r --arg c "$2" \
              '([.statuses[] | select(.context==$c)] | sort_by(.updated_at) | last | .state) // "missing"'
          }

          check_state() {
            printf '%s' "$1" | jq -r --arg c "$2" '
              ([.check_runs[] | select(.name==$c)]
                | sort_by(.completed_at // .started_at // .created_at // "")
                | last) as $run
              | if $run == null then "missing"
                elif $run.status != "completed" then "pending"
                elif ($run.conclusion // "") == "success" then "success"
                elif ($run.conclusion // "") == "neutral" then "success"
                elif ($run.conclusion // "") == "skipped" then "missing"
                elif ($run.conclusion // "") == "failure" then "failure"
                elif ($run.conclusion // "") == "timed_out" then "missing"
                elif ($run.conclusion // "") == "action_required" then "failure"
                elif ($run.conclusion // "") == "cancelled" then "missing"
                else "pending"
                end
            '
          }

          voter_state() {
            local commit_status check_run
            commit_status="$(status_state "$1" "$3")"
            check_run="$(check_state "$2" "$3")"

            case "$commit_status" in
              failure|error|success) printf '%s' "$commit_status" ; return ;;
            esac
            case "$check_run" in
              failure|success) printf '%s' "$check_run" ; return ;;
            esac
            if [ "$commit_status" = "pending" ]; then
              printf 'pending'
              return
            fi
            printf '%s' "$check_run"
          }

          while :; do
            combined="$(gh api "repos/$REPO/commits/$SHA/status" 2>/dev/null || echo '{"statuses":[]}')"
            checks="$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" 2>/dev/null | jq -s '{"check_runs":[.[].check_runs[]?]}' 2>/dev/null || echo '{"check_runs":[]}' )"

            reported=0 ; blocking=0 ; active_pending=0 ; missing=0 ; summary=""
            while IFS= read -r ctx; do
              [ -z "$ctx" ] && continue
              st="$(voter_state "$combined" "$checks" "$ctx")"
              summary="${summary}${ctx}=${st}; "
              case "$st" in
                failure|error) reported=$((reported+1)); blocking=$((blocking+1)) ;;
                success)       reported=$((reported+1)) ;;
                pending)       active_pending=$((active_pending+1)) ;;
                missing)       missing=$((missing+1)) ;;
              esac
            done <<< "$voters"

            missing_unknown=0
            if [ "$(date +%s)" -lt "$missing_grace_deadline" ]; then
              missing_unknown="$missing"
            fi
            unknown=$((active_pending + missing_unknown))

            echo "$(date +%H:%M:%S)  $summary| reported=$reported blocking=$blocking active_pending=$active_pending missing=$missing unknown=$unknown"

            # Decide early the moment the result is unambiguous:
            #  - quorum to block already reached -> BLOCK now.
            #  - quorum can no longer be reached even if all pending fail -> PASS now.
            if [ "$blocking" -ge "$BLOCK_QUORUM" ]; then
              echo "::error::Diff Guardian: $blocking reviewers flagged blocking issues (quorum $BLOCK_QUORUM). Review the failing reviewers, fix, or add 'bypass-ai-gate'."
              set_status failure "$blocking reviewers flagged blocking issues (quorum $BLOCK_QUORUM)"
              exit 1
            fi
            if [ "$is_fork_pr" = "true" ] && [ "$reported" -lt "$MIN_FORK_REPORTED" ] && [ "$unknown" -eq 0 ]; then
              echo "::error::Diff Guardian: fork PRs require at least $MIN_FORK_REPORTED trusted manual AI reviewer result before this gate can pass."
              set_status failure "Fork PR needs trusted manual AI review"
              exit 1
            fi
            if [ $((blocking + unknown)) -lt "$BLOCK_QUORUM" ]; then
              echo "Diff Guardian: quorum to block is unreachable — passing."
              set_status success "No reviewer quorum on blocking issues ($blocking/$BLOCK_QUORUM)"
              exit 0
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              if [ "$active_pending" -gt 0 ] && [ $((blocking + active_pending)) -ge "$BLOCK_QUORUM" ]; then
                echo "::warning::Diff Guardian: timed out with active reviewer checks still capable of reaching block quorum ($summary). Leaving the Diff Guardian commit status pending until the reviewer workflow_run completion re-tallies."
                set_status pending "Waiting for late AI reviewer completion"
                exit 0
              fi
              # Timed out with only missing voters left. Missing/timed-out
              # reviewers are abstentions, not blocking votes.
              echo "::warning::Diff Guardian: timed out waiting for reviewers ($summary). Passing on available non-missing results."
              set_status success "Timed out; $blocking/$BLOCK_QUORUM blocking among reported reviewers"
              exit 0
            fi
            sleep 30
          done
