name: '🔀 Gemini Dispatch'

on:
  pull_request:
    types:
      - 'opened'
      - 'synchronize'
      - 'reopened'
      - 'ready_for_review'
  pull_request_review_comment:
    types:
      - 'created'
  pull_request_review:
    types:
      - 'submitted'
  issue_comment:
    types:
      - 'created'

defaults:
  run:
    shell: 'bash'

jobs:
  dispatch:
    # Gemini review auto-runs for same-repo, non-draft pull requests and can be
    # manually re-triggered with `@gemini-cli /review` by maintainers. Forked-PR
    # comments are rejected here and re-checked server-side in
    # `extract_review_context` before any secrets are inherited by the reusable
    # review workflow.
    if: |-
      (
        (
          github.event_name == 'pull_request' &&
          !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
          github.event.sender.type == 'User' &&
          (
            contains(fromJSON('["pull_request_review_comment", "pull_request_review"]'), github.event_name) ||
            (github.event_name == 'issue_comment' && github.event.issue.pull_request)
          ) &&
          startsWith(github.event.comment.body || github.event.review.body, '@gemini-cli /review') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association)
        )
      )
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    outputs:
      additional_context: '${{ steps.extract_review_context.outputs.additional_context }}'
      should_review: '${{ steps.extract_review_context.outputs.should_review }}'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Extract review context'
        id: 'extract_review_context'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # ratchet:actions/github-script@v7
        env:
          REQUEST: '${{ github.event.comment.body || github.event.review.body }}'
          EVENT_NAME: '${{ github.event_name }}'
        with:
          script: |-
            // Always resolve the PR head repo from the API so we cannot be
            // tricked by a fork-owned payload into leaking secrets. This guards
            // against fork PR comments where `pull_request.head.repo.full_name`
            // differs from `github.repository`.
            let headRepoFullName = '';
            const pullNumber = context.payload.pull_request?.number || context.issue?.number;
            if (pullNumber) {
              const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              });
              headRepoFullName = pullRequest.head.repo?.full_name || '';
            }

            const sameRepo = headRepoFullName === `${context.repo.owner}/${context.repo.repo}`;
            core.setOutput('should_review', sameRepo ? 'true' : 'false');

            const request = process.env.REQUEST || '';
            const additionalContext = request.replace(/^@gemini-cli \/review/, '').trim();
            core.setOutput('additional_context', additionalContext);

      - name: 'Acknowledge request'
        if: |-
          ${{ steps.extract_review_context.outputs.should_review == 'true' && github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          MESSAGE: |-
            🤖 Hi @${{ github.actor }}, Gemini review is running now. You can track progress [in the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          REPOSITORY: '${{ github.repository }}'
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "${MESSAGE}" \
            --repo "${REPOSITORY}"

  review:
    needs: 'dispatch'
    if: |-
      ${{ needs.dispatch.outputs.should_review == 'true' }}
    uses: './.github/workflows/gemini-review.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'
