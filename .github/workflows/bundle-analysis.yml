name: Bundle Analysis

on:
  # Run weekly to keep an eye on size drift
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9am
  # Allow manual trigger
  workflow_dispatch:
  # Run on main branch pushes to verify impact
  push:
    branches: [main]
    paths:
      - "apps/web/package.json"
      - "pnpm-lock.yaml"
      - "apps/web/next.config.ts"

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Clean stale pnpm setup directory
        run: rm -rf ~/setup-pnpm 2>/dev/null || true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"

      - name: Install Dependencies
        uses: ./.github/actions/pnpm-install-cached
        with:
          store-dir: ${{ runner.temp }}/pnpm-store
          install-command: pnpm install

      - name: Build & Analyze
        run: pnpm --filter @baci/web run analyze
        env:
          # Fallback to dummy values for Dependabot PRs (which can't access repo secrets)
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}

      - name: Upload Analysis Report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bundle-analysis-report
          path: apps/web/.next/analyze/
          retention-days: 30
