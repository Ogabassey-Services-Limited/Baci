name: Claude Code Review

on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/claude review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Parse review command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          first_line="$(printf '%s\n' "$COMMENT_BODY" | tr -d '\r' | awk 'NF { print; exit }')"

          if [[ "$first_line" == '/claude review' ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping Claude review because the first non-empty line is not exactly /claude review."

      - name: Checkout repository
        if: steps.command.outputs.should_run == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Bun
        if: steps.command.outputs.should_run == 'true'
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6

      - name: Run Claude Code Review
        if: steps.command.outputs.should_run == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_bun_executable: ${{ steps.bun.outputs.bun-path }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.issue.number }}'
          # Set the repository variable CLAUDE_MODEL to pin a specific Claude model.
          claude_args: >-
            ${{ vars.CLAUDE_MODEL != '' && format('--model {0}', vars.CLAUDE_MODEL) || '' }}
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
