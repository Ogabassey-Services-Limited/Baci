name: MCP Production Smoke

on:
  push:
    branches: [main]
    paths:
      - "apps/web/mcp-server/**"
      - ".github/scripts/check-live-mcp-tools.mjs"
      - ".github/workflows/mcp-production-smoke.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-production-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MCP_HEALTH_URL: ${{ vars.MCP_HEALTH_URL || 'https://mcp.ogabassey.com/health' }}
      MCP_SMOKE_URL: ${{ vars.MCP_SMOKE_URL || 'https://mcp.ogabassey.com/mcp' }}
      MCP_REQUIRED_TOOLS: ${{ vars.MCP_REQUIRED_TOOLS || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Check live MCP tools
        run: node .github/scripts/check-live-mcp-tools.mjs
