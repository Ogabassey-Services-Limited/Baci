name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      mobile_admin: ${{ steps.filter.outputs.mobile_admin }}
      mobile_storefront: ${{ steps.filter.outputs.mobile_storefront }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            mobile_admin:
              - 'apps/mobile-admin/**'
              - 'packages/shared/**'
              - '.github/actions/pnpm-install-cached/**'
              - '.github/actions/setup-pnpm-store/**'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'biome.json'
            mobile_storefront:
              - 'apps/mobile-storefront/assets/quiz/**'
              - 'apps/mobile-storefront/app/**'
              - 'apps/mobile-storefront/components/**'
              - 'apps/mobile-storefront/config/**'
              - 'apps/mobile-storefront/constants/**'
              - 'apps/mobile-storefront/hooks/**'
              - 'apps/mobile-storefront/lib/**'
              - 'apps/mobile-storefront/schemas/**'
              - 'apps/mobile-storefront/scripts/**'
              - 'apps/mobile-storefront/services/**'
              - 'apps/mobile-storefront/stores/**'
              - 'apps/mobile-storefront/package.json'
              - 'packages/shared/**'
              - '.github/actions/pnpm-install-cached/**'
              - '.github/actions/setup-pnpm-store/**'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'biome.json'
            web:
              - 'apps/web/**'
              - 'apps/mobile-storefront/assets/quiz/**'
              - 'apps/mobile-storefront/app/**'
              - 'apps/mobile-storefront/components/**'
              - 'apps/mobile-storefront/config/**'
              - 'apps/mobile-storefront/constants/**'
              - 'apps/mobile-storefront/hooks/**'
              - 'apps/mobile-storefront/lib/**'
              - 'apps/mobile-storefront/schemas/**'
              - 'apps/mobile-storefront/scripts/**'
              - 'apps/mobile-storefront/services/**'
              - 'apps/mobile-storefront/stores/**'
              - 'apps/mobile-storefront/package.json'
              - 'packages/shared/**'
              - '.github/actions/pnpm-install-cached/**'
              - '.github/actions/setup-pnpm-store/**'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'biome.json'

  quality-lint:
    name: Quality Gate - Lint
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Clean stale pnpm setup directory
        run: rm -rf ~/setup-pnpm 2>/dev/null || true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Cache Turborepo local runs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-lint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-lint-
      - uses: ./.github/actions/pnpm-install-cached
        with:
          store-dir: ${{ runner.temp }}/pnpm-store
      - name: Run Lint
        run: pnpm turbo lint

  quality-typecheck:
    name: Quality Gate - Typecheck
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Clean stale pnpm setup directory
        run: rm -rf ~/setup-pnpm 2>/dev/null || true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Cache Turborepo local runs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-typecheck-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-typecheck-
      - uses: ./.github/actions/pnpm-install-cached
        with:
          store-dir: ${{ runner.temp }}/pnpm-store
      - name: Run Typecheck
        run: pnpm turbo typecheck

  quality-test:
    name: Quality Gate - Test
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Clean stale pnpm setup directory
        run: rm -rf ~/setup-pnpm 2>/dev/null || true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Cache Turborepo local runs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-
      - uses: ./.github/actions/pnpm-install-cached
        with:
          store-dir: ${{ runner.temp }}/pnpm-store
      - name: Run Tests
        run: pnpm turbo test --concurrency=3

  quality-misc:
    name: Quality Gate - Misc
    needs: [changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.mobile_storefront == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Clean stale pnpm setup directory
        run: rm -rf ~/setup-pnpm 2>/dev/null || true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Cache Turborepo local runs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-misc-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-misc-
      - uses: ./.github/actions/pnpm-install-cached
        with:
          store-dir: ${{ runner.temp }}/pnpm-store
      - name: Verify Quiz Assets
        if: needs.changes.outputs.web == 'true'
        run: pnpm --filter @baci/web verify:quiz-assets
      - name: Verify Storefront Route Size
        if: needs.changes.outputs.mobile_storefront == 'true'
        run: pnpm --filter @baci/mobile-storefront check:route-size
      - name: Run Knip Dead Code Check
        if: needs.changes.outputs.web == 'true'
        run: pnpm knip


  mobile-quality:
    name: Mobile Admin Guardrails
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.mobile_admin == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - if: needs.changes.outputs.mobile_admin == 'true'
        name: Clean stale pnpm setup directory
        run: rm -rf ~/setup-pnpm 2>/dev/null || true
      - if: needs.changes.outputs.mobile_admin == 'true'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - if: needs.changes.outputs.mobile_admin == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - if: needs.changes.outputs.mobile_admin == 'true'
        uses: ./.github/actions/pnpm-install-cached
        with:
          store-dir: ${{ runner.temp }}/pnpm-store
      - if: needs.changes.outputs.mobile_admin == 'true'
        run: pnpm --dir apps/mobile-admin exec vitest run scripts/check-platform-drift.test.ts
      - if: needs.changes.outputs.mobile_admin == 'true'
        run: pnpm --dir apps/mobile-admin check:platform-drift
      - if: needs.changes.outputs.mobile_admin != 'true'
        run: echo "No mobile-admin changes — skipping mobile guardrail checks"

  build:
    name: Build
    needs: [changes, quality-lint, quality-typecheck, quality-test, quality-misc, mobile-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.web == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - if: needs.changes.outputs.web == 'true'
        name: Clean stale pnpm setup directory
        run: rm -rf ~/setup-pnpm 2>/dev/null || true
      - if: needs.changes.outputs.web == 'true'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - if: needs.changes.outputs.web == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/shared/src/**') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-build-
      - if: needs.changes.outputs.web == 'true'
        uses: ./.github/actions/pnpm-install-cached
        with:
          store-dir: ${{ runner.temp }}/pnpm-store
      - if: needs.changes.outputs.web == 'true'
        run: pnpm turbo build --filter=@baci/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}
      - if: needs.changes.outputs.web != 'true'
        run: echo "No web changes — skipping build"
