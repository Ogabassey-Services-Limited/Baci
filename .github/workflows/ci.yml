name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required so the quality gate runs on merge-queue integration commits.
  # Without this, an enabled merge queue would deadlock waiting for checks
  # that never start. See the `changes` job for merge_group handling.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# TURBO_TOKEN/TURBO_TEAM are Vercel Remote Cache secrets. They are scoped to the
# individual turbo steps that need them (lint/typecheck/test) rather than the
# workflow-level env, so they are not exposed to unrelated jobs/steps or the
# third-party actions they run. TURBO_SCM_BASE is not a secret and stays global
# so `turbo --affected` can resolve its base ref everywhere.
env:
  TURBO_SCM_BASE: origin/main

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      mobile_admin: ${{ steps.gate.outputs.mobile_admin }}
      mobile_storefront: ${{ steps.gate.outputs.mobile_storefront }}
      test_plan_mode: ${{ steps.test-plan.outputs.mode }}
      test_plan_reason: ${{ steps.test-plan.outputs.reason }}
      web: ${{ steps.gate.outputs.web }}
      quiz_db: ${{ steps.gate.outputs.quiz_db }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      # paths-filter can't infer a base on merge_group events, so skip it there
      # and run every gate (the queue validates the full integration anyway).
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        if: github.event_name != 'merge_group'
        with:
          token: ''
          filters: |
            mobile_admin:
              - 'apps/mobile-admin/**'
              - 'packages/shared/**'
              - '.github/actions/pnpm-install-cached/**'
              - '.github/actions/setup-pnpm-store/**'
              - '.github/scripts/resolve-ci-test-plan.mjs'
              - '.github/scripts/resolve-ci-test-plan-config.mjs'
              - '.github/scripts/resolve-ci-test-plan-config.test.mjs'
              - '.github/scripts/resolve-ci-test-plan.test.mjs'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'biome.json'
              - '.npmrc'
              - 'pnpm-workspace.yaml'
            mobile_storefront:
              - 'apps/mobile-storefront/assets/quiz/**'
              - 'apps/mobile-storefront/app/**'
              - 'apps/mobile-storefront/app.config.ts'
              - 'apps/mobile-storefront/components/**'
              - 'apps/mobile-storefront/config/**'
              - 'apps/mobile-storefront/constants/**'
              - 'apps/mobile-storefront/hooks/**'
              - 'apps/mobile-storefront/ios/**'
              - 'apps/mobile-storefront/lib/**'
              - 'apps/mobile-storefront/schemas/**'
              - 'apps/mobile-storefront/scripts/**'
              - 'apps/mobile-storefront/services/**'
              - 'apps/mobile-storefront/stores/**'
              - 'apps/mobile-storefront/package.json'
              - 'packages/shared/**'
              - '.github/actions/pnpm-install-cached/**'
              - '.github/actions/setup-pnpm-store/**'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'biome.json'
              - '.npmrc'
              - 'pnpm-workspace.yaml'
            # Root Next config changes affect the web app even when apps/web/**
            # is untouched; keep them in the web quality-gate filter.
            quiz_db:
              - 'supabase/migrations/**'
            web:
              - 'apps/web/**'
              - 'apps/mobile-storefront/assets/quiz/**'
              - 'apps/mobile-storefront/app/**'
              - 'apps/mobile-storefront/app.config.ts'
              - 'apps/mobile-storefront/components/**'
              - 'apps/mobile-storefront/config/**'
              - 'apps/mobile-storefront/constants/**'
              - 'apps/mobile-storefront/hooks/**'
              - 'apps/mobile-storefront/lib/**'
              - 'apps/mobile-storefront/schemas/**'
              - 'apps/mobile-storefront/scripts/**'
              - 'apps/mobile-storefront/services/**'
              - 'apps/mobile-storefront/stores/**'
              - 'apps/mobile-storefront/package.json'
              - 'packages/shared/**'
              - 'next.config.ts'
              - 'next.config.test.ts'
              - '.github/actions/pnpm-install-cached/**'
              - '.github/actions/setup-pnpm-store/**'
              - '.github/scripts/resolve-ci-test-plan.mjs'
              - '.github/scripts/resolve-ci-test-plan-config.mjs'
              - '.github/scripts/resolve-ci-test-plan-config.test.mjs'
              - '.github/scripts/resolve-ci-test-plan.test.mjs'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'biome.json'
              - '.npmrc'
              - 'pnpm-workspace.yaml'
      - name: Resolve change flags (run all gates in the merge queue)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_MOBILE_ADMIN: ${{ steps.filter.outputs.mobile_admin }}
          FILTER_MOBILE_STOREFRONT: ${{ steps.filter.outputs.mobile_storefront }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          FILTER_QUIZ_DB: ${{ steps.filter.outputs.quiz_db }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "merge_group" ]; then
            mobile_admin=true
            mobile_storefront=true
            web=true
            quiz_db=true
          else
            mobile_admin="${FILTER_MOBILE_ADMIN:-false}"
            mobile_storefront="${FILTER_MOBILE_STOREFRONT:-false}"
            web="${FILTER_WEB:-false}"
            quiz_db="${FILTER_QUIZ_DB:-false}"
          fi
          {
            echo "mobile_admin=$mobile_admin"
            echo "mobile_storefront=$mobile_storefront"
            echo "web=$web"
            echo "quiz_db=$quiz_db"
          } >> "$GITHUB_OUTPUT"
      - name: Resolve test plan
        id: test-plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/resolve-ci-test-plan.mjs --event "$EVENT_NAME" --base "$TURBO_SCM_BASE"

  quality-lint:
    name: Quality Gate - Lint
    needs: [changes]
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Run Lint
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo lint --affected
          else
            pnpm turbo lint
          fi

  quality-typecheck:
    name: Quality Gate - Typecheck
    needs: [changes]
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Run Typecheck
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo typecheck --affected
          else
            pnpm turbo typecheck
          fi

  quality-test:
    name: Quality Gate - Test
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    # Full web/mobile test fan-out reached ~15 minutes warm, but cold runs
    # (Turbo remote cache unavailable) measure 31m+ on GitHub-hosted runners —
    # three consecutive 30m timeouts on cold caches. Keep headroom for Turbo
    # summary and Actions post-job cleanup.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Resolve test plan
        id: test-plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/resolve-ci-test-plan.mjs --event "$EVENT_NAME" --base "$TURBO_SCM_BASE"
      - name: Run Tests
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          EVENT_NAME: ${{ github.event_name }}
          TEST_PLAN_MODE: ${{ steps.test-plan.outputs.mode }}
          TEST_PLAN_REASON: ${{ steps.test-plan.outputs.reason }}
        run: |
          if [ "$TEST_PLAN_MODE" = "config-smoke" ]; then
            echo "$TEST_PLAN_REASON"
            pnpm exec biome check turbo.json .github/scripts/resolve-ci-test-plan.mjs .github/scripts/resolve-ci-test-plan.test.mjs .github/scripts/resolve-ci-test-plan-config.mjs .github/scripts/resolve-ci-test-plan-config.test.mjs
            node --test .github/scripts/resolve-ci-test-plan.test.mjs .github/scripts/resolve-ci-test-plan-config.test.mjs
            exit 0
          fi

          if [ "$TEST_PLAN_MODE" = "targeted-web-vitest" ]; then
            echo "$TEST_PLAN_REASON"
            pnpm --filter @baci/web exec vitest run --changed "$TURBO_SCM_BASE" --passWithNoTests
            exit 0
          fi

          if [ "$TEST_PLAN_MODE" = "targeted-storefront-jest" ]; then
            echo "$TEST_PLAN_REASON"
            pnpm --filter @baci/mobile-storefront exec jest --changedSince "$TURBO_SCM_BASE" --runInBand --passWithNoTests
            exit 0
          fi

          if [ "$TEST_PLAN_MODE" = "targeted-web-and-storefront-tests" ]; then
            echo "$TEST_PLAN_REASON"
            pnpm --filter @baci/web exec vitest run --changed "$TURBO_SCM_BASE" --passWithNoTests
            pnpm --filter @baci/mobile-storefront exec jest --changedSince "$TURBO_SCM_BASE" --runInBand --passWithNoTests
            exit 0
          fi

          turbo_cache_args=("--cache=local:rw,remote:r")
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # PR tokens can read Vercel Remote Cache but may not be allowed to write artifacts.
            # Use --affected to test only impacted packages.
            turbo_cache_args+=(--affected)
          else
            turbo_cache_args=("--cache=local:rw,remote:rw")
          fi
          pnpm turbo run test --concurrency=3 --log-order=stream "${turbo_cache_args[@]}"

  quality-misc:
    name: Quality Gate - Misc
    needs: [changes]
    if: (needs.changes.outputs.web == 'true' || needs.changes.outputs.mobile_storefront == 'true' || needs.changes.outputs.quiz_db == 'true') && needs.changes.outputs.test_plan_mode != 'config-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Run CI Test Planner Unit Tests
        if: needs.changes.outputs.web == 'true'
        run: node --test .github/scripts/resolve-ci-test-plan.test.mjs .github/scripts/resolve-ci-test-plan-config.test.mjs
      - name: Verify Quiz Assets
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.quiz_db == 'true'
        run: pnpm --filter @baci/web verify:quiz-assets
      # A migration-only (quiz_db) PR would otherwise satisfy this required gate
      # with no real work, because every other step is web/mobile/production-only.
      # Run the quiz + orders suites (which exercise the RPC-dependent route
      # logic) so a DB-only change is actually validated here. True SQL-level
      # migration testing runs out of band (prod txn+rollback verification and
      # the deploy pipeline) — a from-scratch apply in CI is blocked by
      # Supabase-specific schema/roles.
      - name: Run Quiz Suite for DB-only Changes
        if: needs.changes.outputs.quiz_db == 'true' && needs.changes.outputs.web != 'true'
        run: >-
          pnpm --filter @baci/web exec vitest run
          src/app/api/quiz
          src/app/api/orders
          src/app/api/merchant/quiz
          src/app/dashboard/quiz
      # Hard pre-launch gate: only enforced when the repo is configured for the
      # production quiz phase (QUIZ_PHASE repo variable = "production"). It
      # validates NLRC permits, published odds, compliance tracker rows, and the
      # quiz RPC server secret against the live database. Skipped on normal PRs
      # so it never blocks unrelated work, but visible as its own named step.
      - name: Verify Quiz Production Approval
        if: (needs.changes.outputs.web == 'true' || needs.changes.outputs.quiz_db == 'true') && vars.QUIZ_PHASE == 'production'
        env:
          QUIZ_PHASE: ${{ vars.QUIZ_PHASE }}
          QUIZ_PRODUCTION_APPROVED: ${{ vars.QUIZ_PRODUCTION_APPROVED }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QUIZ_RPC_SERVER_SECRET: ${{ secrets.QUIZ_RPC_SERVER_SECRET }}
        run: pnpm --filter @baci/web check:quiz-approval
      - name: Run Storefront Guardrail Unit Tests
        if: needs.changes.outputs.mobile_storefront == 'true'
        run: pnpm --filter @baci/mobile-storefront exec jest scripts/check-platform-drift.test.ts scripts/check-module-size.test.ts scripts/check-ad-tracking-native-config.test.ts --runInBand
      - name: Verify Storefront Ad Tracking Native Config
        if: needs.changes.outputs.mobile_storefront == 'true'
        run: pnpm --filter @baci/mobile-storefront check:ad-tracking-native-config
      - name: Verify Storefront Route Size
        if: needs.changes.outputs.mobile_storefront == 'true'
        run: pnpm --filter @baci/mobile-storefront check:route-size
      - name: Verify Storefront Platform Drift
        if: needs.changes.outputs.mobile_storefront == 'true'
        run: pnpm --filter @baci/mobile-storefront check:platform-drift
      - name: Verify Storefront Module Size
        if: needs.changes.outputs.mobile_storefront == 'true'
        run: pnpm --filter @baci/mobile-storefront check:module-size
      - name: Run Knip Dead Code Check
        if: needs.changes.outputs.web == 'true'
        run: pnpm knip


  silent-revert-guard:
    name: Silent Revert Guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fetch base branch history
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --filter=blob:none --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - name: Detect silent reverts of recent main commits
        env:
          ALLOW_SILENT_REVERT: ${{ contains(github.event.pull_request.labels.*.name, 'allow-silent-revert') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SILENT_REVERT_LOOKBACK: '80'
        run: node ci_scripts/detect-silent-reverts.mjs

  quality:
    name: Quality Gate
    needs: [changes, quality-lint, quality-typecheck, quality-test, quality-misc, silent-revert-guard]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify split quality gate results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs['quality-lint'].result }}
          TYPECHECK_RESULT: ${{ needs['quality-typecheck'].result }}
          TEST_RESULT: ${{ needs['quality-test'].result }}
          MISC_RESULT: ${{ needs['quality-misc'].result }}
          SILENT_REVERT_GUARD_RESULT: ${{ needs['silent-revert-guard'].result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "changes job result: $CHANGES_RESULT"
            exit 1
          fi

          for result in "$LINT_RESULT" "$TYPECHECK_RESULT" "$TEST_RESULT" "$MISC_RESULT" "$SILENT_REVERT_GUARD_RESULT"; do
            case "$result" in
              success|skipped)
                ;;
              *)
                echo "split quality job failed or was cancelled: $result"
                exit 1
                ;;
            esac
          done

          echo "Split quality gates passed."

  mobile-quality:
    name: Mobile Admin Guardrails
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        uses: ./.github/actions/pnpm-install-cached
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --dir apps/mobile-admin exec vitest run scripts/check-platform-drift.test.ts
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --dir apps/mobile-admin exec vitest run scripts/check-module-size.test.ts
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --dir apps/mobile-admin check:platform-drift
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --dir apps/mobile-admin check:module-size
      - if: needs.changes.outputs.mobile_admin != 'true' || needs.changes.outputs.test_plan_mode == 'config-smoke'
        run: echo "No mobile-admin changes — skipping mobile guardrail checks"

  build:
    name: Build
    needs: [changes, quality, mobile-quality]
    # Required-check hygiene: this gate must be always-CONCLUSIVE. Without an
    # explicit `if`, GitHub skips `build` whenever an upstream `needs` job is
    # skipped, and a "skipped" required check permanently blocks merge under
    # enforce_admins for legitimate migration/docs/CI-only PRs (the web build
    # has nothing to do, but the check never reports success). Run unless an
    # upstream job actually failed/was cancelled; the web build steps stay gated
    # on changes.web and the final step reports success when there is nothing to build.
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        uses: ./.github/actions/pnpm-install-cached
      - id: next-cache
        name: Restore Next.js build cache
        if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig*.json', 'apps/web/**/*', 'packages/shared/**/*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-
      - if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm turbo build --filter=@baci/web
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          NODE_OPTIONS: "--max_old_space_size=8192"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET || 'placeholder-jwt-secret' }}
      - name: Save Next.js build cache (main branch only)
        if: >
          needs.changes.outputs.web == 'true' &&
          needs.changes.outputs.test_plan_mode != 'config-smoke' &&
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push' &&
          steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/apps/web/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
      - if: needs.changes.outputs.web != 'true' || needs.changes.outputs.test_plan_mode == 'config-smoke'
        run: echo "No web changes — skipping build"
