name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'biome.json'

  quality:
    name: Quality Gate
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PNPM_STORE_DIR: ${{ runner.temp }}/pnpm-store
    steps:
      - if: needs.changes.outputs.web == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - if: needs.changes.outputs.web == 'true'
        name: Clean stale pnpm setup directory
        run: rm -rf ~/setup-pnpm 2>/dev/null || true
      - if: needs.changes.outputs.web == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
      - if: needs.changes.outputs.web == 'true'
        id: pnpm-store-cache
        name: Restore pnpm store cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-
      - if: needs.changes.outputs.web == 'true'
        id: pnpm-store-validation
        name: Validate pnpm store cache metadata
        shell: bash
        run: |
          set -euo pipefail
          lockfile_hash="$(sha256sum pnpm-lock.yaml | cut -d ' ' -f1)"
          marker_file="${PNPM_STORE_DIR}/.pnpm-lock-hash"
          cache_valid="false"

          if [[ -f "${marker_file}" ]] && [[ "$(cat "${marker_file}")" == "${lockfile_hash}" ]]; then
            cache_valid="true"
          fi

          echo "lockfile_hash=${lockfile_hash}" >> "$GITHUB_OUTPUT"
          echo "cache_valid=${cache_valid}" >> "$GITHUB_OUTPUT"
      - if: needs.changes.outputs.web == 'true' && steps.pnpm-store-validation.outputs.cache_valid == 'true'
        uses: ./.github/actions/setup-pnpm-store
        with:
          store-dir: ${{ env.PNPM_STORE_DIR }}
      - if: needs.changes.outputs.web == 'true' && steps.pnpm-store-validation.outputs.cache_valid != 'true'
        uses: ./.github/actions/setup-pnpm-store
        with:
          store-dir: ${{ env.PNPM_STORE_DIR }}
          reset: 'true'
      - if: needs.changes.outputs.web == 'true'
        id: pnpm-install
        name: Install dependencies
        continue-on-error: true
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.web == 'true' && steps.pnpm-install.outcome == 'failure'
        uses: ./.github/actions/setup-pnpm-store
        with:
          store-dir: ${{ env.PNPM_STORE_DIR }}
          reset: 'true'
      - if: needs.changes.outputs.web == 'true' && steps.pnpm-install.outcome == 'failure'
        name: Retry dependency install with clean pnpm store
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.web == 'true'
        name: Record pnpm store lockfile hash
        shell: bash
        run: printf '%s' '${{ steps.pnpm-store-validation.outputs.lockfile_hash }}' > "${PNPM_STORE_DIR}/.pnpm-lock-hash"
      - if: needs.changes.outputs.web == 'true' && steps.pnpm-store-cache.outputs.cache-hit != 'true'
        name: Save pnpm store cache
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: ${{ steps.pnpm-store-cache.outputs.cache-primary-key }}
      # Run monorepo-wide lint/typecheck/test (not filtered to @baci/web)
      # to catch cross-package breakages from shared code changes
      - if: needs.changes.outputs.web == 'true'
        run: pnpm turbo lint typecheck test --concurrency=3
      - if: needs.changes.outputs.web == 'true'
        run: pnpm knip
      - if: needs.changes.outputs.web != 'true'
        run: echo "No web changes — skipping quality checks"

  build:
    name: Build
    needs: [changes, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PNPM_STORE_DIR: ${{ runner.temp }}/pnpm-store
    steps:
      - if: needs.changes.outputs.web == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - if: needs.changes.outputs.web == 'true'
        name: Clean stale pnpm setup directory
        run: rm -rf ~/setup-pnpm 2>/dev/null || true
      - if: needs.changes.outputs.web == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
      - if: needs.changes.outputs.web == 'true'
        id: pnpm-store-cache
        name: Restore pnpm store cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-
      - if: needs.changes.outputs.web == 'true'
        id: pnpm-store-validation
        name: Validate pnpm store cache metadata
        shell: bash
        run: |
          set -euo pipefail
          lockfile_hash="$(sha256sum pnpm-lock.yaml | cut -d ' ' -f1)"
          marker_file="${PNPM_STORE_DIR}/.pnpm-lock-hash"
          cache_valid="false"

          if [[ -f "${marker_file}" ]] && [[ "$(cat "${marker_file}")" == "${lockfile_hash}" ]]; then
            cache_valid="true"
          fi

          echo "lockfile_hash=${lockfile_hash}" >> "$GITHUB_OUTPUT"
          echo "cache_valid=${cache_valid}" >> "$GITHUB_OUTPUT"
      - if: needs.changes.outputs.web == 'true' && steps.pnpm-store-validation.outputs.cache_valid == 'true'
        uses: ./.github/actions/setup-pnpm-store
        with:
          store-dir: ${{ env.PNPM_STORE_DIR }}
      - if: needs.changes.outputs.web == 'true' && steps.pnpm-store-validation.outputs.cache_valid != 'true'
        uses: ./.github/actions/setup-pnpm-store
        with:
          store-dir: ${{ env.PNPM_STORE_DIR }}
          reset: 'true'
      - if: needs.changes.outputs.web == 'true'
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/shared/src/**') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-build-
      - if: needs.changes.outputs.web == 'true'
        id: pnpm-install
        name: Install dependencies
        continue-on-error: true
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.web == 'true' && steps.pnpm-install.outcome == 'failure'
        uses: ./.github/actions/setup-pnpm-store
        with:
          store-dir: ${{ env.PNPM_STORE_DIR }}
          reset: 'true'
      - if: needs.changes.outputs.web == 'true' && steps.pnpm-install.outcome == 'failure'
        name: Retry dependency install with clean pnpm store
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.web == 'true'
        name: Record pnpm store lockfile hash
        shell: bash
        run: printf '%s' '${{ steps.pnpm-store-validation.outputs.lockfile_hash }}' > "${PNPM_STORE_DIR}/.pnpm-lock-hash"
      - if: needs.changes.outputs.web == 'true' && steps.pnpm-store-cache.outputs.cache-hit != 'true'
        name: Save pnpm store cache
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: ${{ steps.pnpm-store-cache.outputs.cache-primary-key }}
      - if: needs.changes.outputs.web == 'true'
        run: pnpm turbo build --filter=@baci/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}
      - if: needs.changes.outputs.web != 'true'
        run: echo "No web changes — skipping build"
