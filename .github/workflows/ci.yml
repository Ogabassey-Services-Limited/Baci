name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_SCM_BASE: origin/main

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      mobile_admin: ${{ steps.filter.outputs.mobile_admin }}
      mobile_storefront: ${{ steps.filter.outputs.mobile_storefront }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          token: ''
          filters: |
            mobile_admin:
              - 'apps/mobile-admin/**'
              - 'packages/shared/**'
              - '.github/actions/pnpm-install-cached/**'
              - '.github/actions/setup-pnpm-store/**'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'biome.json'
            mobile_storefront:
              - 'apps/mobile-storefront/assets/quiz/**'
              - 'apps/mobile-storefront/app/**'
              - 'apps/mobile-storefront/components/**'
              - 'apps/mobile-storefront/config/**'
              - 'apps/mobile-storefront/constants/**'
              - 'apps/mobile-storefront/hooks/**'
              - 'apps/mobile-storefront/lib/**'
              - 'apps/mobile-storefront/schemas/**'
              - 'apps/mobile-storefront/scripts/**'
              - 'apps/mobile-storefront/services/**'
              - 'apps/mobile-storefront/stores/**'
              - 'apps/mobile-storefront/package.json'
              - 'packages/shared/**'
              - '.github/actions/pnpm-install-cached/**'
              - '.github/actions/setup-pnpm-store/**'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'biome.json'
            web:
              - 'apps/web/**'
              - 'apps/mobile-storefront/assets/quiz/**'
              - 'apps/mobile-storefront/app/**'
              - 'apps/mobile-storefront/components/**'
              - 'apps/mobile-storefront/config/**'
              - 'apps/mobile-storefront/constants/**'
              - 'apps/mobile-storefront/hooks/**'
              - 'apps/mobile-storefront/lib/**'
              - 'apps/mobile-storefront/schemas/**'
              - 'apps/mobile-storefront/scripts/**'
              - 'apps/mobile-storefront/services/**'
              - 'apps/mobile-storefront/stores/**'
              - 'apps/mobile-storefront/package.json'
              - 'packages/shared/**'
              - '.github/actions/pnpm-install-cached/**'
              - '.github/actions/setup-pnpm-store/**'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'biome.json'

  quality-lint:
    name: Quality Gate - Lint
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Run Lint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo lint --affected
          else
            pnpm turbo lint
          fi

  quality-typecheck:
    name: Quality Gate - Typecheck
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Run Typecheck
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo typecheck --affected
          else
            pnpm turbo typecheck
          fi

  quality-test:
    name: Quality Gate - Test
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Run Tests
        run: |
          turbo_cache_args=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR tokens can read Vercel Remote Cache but may not be allowed to write artifacts.
            turbo_cache_args+=(--remote-cache-read-only)
            turbo_cache_args+=(--affected)
          fi
          pnpm turbo test --concurrency=3 "${turbo_cache_args[@]}"

  quality-misc:
    name: Quality Gate - Misc
    needs: [changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.mobile_storefront == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Verify Quiz Assets
        if: needs.changes.outputs.web == 'true'
        run: pnpm --filter @baci/web verify:quiz-assets
      - name: Run Storefront Guardrail Unit Tests
        if: needs.changes.outputs.mobile_storefront == 'true'
        run: pnpm --filter @baci/mobile-storefront exec jest scripts/check-platform-drift.test.ts scripts/check-module-size.test.ts --runInBand
      - name: Verify Storefront Route Size
        if: needs.changes.outputs.mobile_storefront == 'true'
        run: pnpm --filter @baci/mobile-storefront check:route-size
      - name: Verify Storefront Platform Drift
        if: needs.changes.outputs.mobile_storefront == 'true'
        run: pnpm --filter @baci/mobile-storefront check:platform-drift
      - name: Verify Storefront Module Size
        if: needs.changes.outputs.mobile_storefront == 'true'
        run: pnpm --filter @baci/mobile-storefront check:module-size
      - name: Run Knip Dead Code Check
        if: needs.changes.outputs.web == 'true'
        run: pnpm knip

  quality:
    name: Quality Gate
    needs: [changes, quality-lint, quality-typecheck, quality-test, quality-misc]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify split quality gate results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs['quality-lint'].result }}
          TYPECHECK_RESULT: ${{ needs['quality-typecheck'].result }}
          TEST_RESULT: ${{ needs['quality-test'].result }}
          MISC_RESULT: ${{ needs['quality-misc'].result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "changes job result: $CHANGES_RESULT"
            exit 1
          fi

          for result in "$LINT_RESULT" "$TYPECHECK_RESULT" "$TEST_RESULT" "$MISC_RESULT"; do
            case "$result" in
              success|skipped)
                ;;
              *)
                echo "split quality job failed or was cancelled: $result"
                exit 1
                ;;
            esac
          done

          echo "Split quality gates passed."

  mobile-quality:
    name: Mobile Admin Guardrails
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.mobile_admin == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - if: needs.changes.outputs.mobile_admin == 'true'
        uses: ./.github/actions/pnpm-install-cached
      - if: needs.changes.outputs.mobile_admin == 'true'
        run: pnpm --dir apps/mobile-admin exec vitest run scripts/check-platform-drift.test.ts
      - if: needs.changes.outputs.mobile_admin == 'true'
        run: pnpm --dir apps/mobile-admin exec vitest run scripts/check-module-size.test.ts
      - if: needs.changes.outputs.mobile_admin == 'true'
        run: pnpm --dir apps/mobile-admin check:platform-drift
      - if: needs.changes.outputs.mobile_admin == 'true'
        run: pnpm --dir apps/mobile-admin check:module-size
      - if: needs.changes.outputs.mobile_admin != 'true'
        run: echo "No mobile-admin changes — skipping mobile guardrail checks"

  build:
    name: Build
    needs: [changes, quality, mobile-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.web == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - if: needs.changes.outputs.web == 'true'
        uses: ./.github/actions/pnpm-install-cached
      - if: needs.changes.outputs.web == 'true'
        run: pnpm turbo build --filter=@baci/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}
      - if: needs.changes.outputs.web != 'true'
        run: echo "No web changes — skipping build"
