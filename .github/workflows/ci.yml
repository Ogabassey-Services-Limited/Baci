name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'biome.json'

  quality:
    name: Quality Gate
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.web == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - if: needs.changes.outputs.web == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "pnpm"
      - if: needs.changes.outputs.web == 'true'
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - if: needs.changes.outputs.web == 'true'
        run: pnpm install
      # Run monorepo-wide lint/typecheck/test (not filtered to @baci/web)
      # to catch cross-package breakages from shared code changes
      - if: needs.changes.outputs.web == 'true'
        run: pnpm turbo lint typecheck test --concurrency=3
      - if: needs.changes.outputs.web == 'true'
        run: pnpm knip
      - if: needs.changes.outputs.web != 'true'
        run: echo "No web changes — skipping quality checks"

  build:
    name: Build
    needs: [changes, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.web == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - if: needs.changes.outputs.web == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "pnpm"
      - if: needs.changes.outputs.web == 'true'
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: |
            node_modules
            .turbo
            apps/web/.next/cache
          key: ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/shared/src/**') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-build-
      - if: needs.changes.outputs.web == 'true'
        run: pnpm install
      - if: needs.changes.outputs.web == 'true'
        run: pnpm turbo build --filter=@baci/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}
      - if: needs.changes.outputs.web != 'true'
        run: echo "No web changes — skipping build"
