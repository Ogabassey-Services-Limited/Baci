name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  changes:
    # Lightweight (just git diff) — runs on GitHub-hosted to keep
    # fork/Dependabot PR code off VPS entirely.
    runs-on: ubuntu-22.04
    outputs:
      web: ${{ steps.filter.outputs.web }}
      is_untrusted: ${{ steps.trust.outputs.is_untrusted }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'biome.json'
      - id: trust
        # Untrusted = fork PR OR Dependabot PR. Neither should run on VPS.
        run: |
          IS_FORK="false"
          IS_DEPENDABOT="false"
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            IS_FORK="true"
          fi
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            IS_DEPENDABOT="true"
          fi
          if [ "$IS_FORK" = "true" ] || [ "$IS_DEPENDABOT" = "true" ]; then
            echo "is_untrusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_untrusted=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality Gate
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    # Fork/Dependabot PRs run on GitHub-hosted (untrusted code stays off VPS)
    runs-on: ${{ needs.changes.outputs.is_untrusted == 'true' && 'ubuntu-22.04' || 'baci-vps' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "pnpm"
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install
      # Run monorepo-wide lint/typecheck/test (not filtered to @baci/web)
      # to catch cross-package breakages from shared code changes
      - run: pnpm turbo lint typecheck test --concurrency=3
      - run: pnpm knip

  build:
    name: Build
    needs: [changes, quality]
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ needs.changes.outputs.is_untrusted == 'true' && 'ubuntu-22.04' || 'baci-vps' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "pnpm"
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: |
            node_modules
            .turbo
            apps/web/.next/cache
          key: ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/shared/src/**') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-build-
      - run: pnpm install
      - run: pnpm turbo build --filter=@baci/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}
