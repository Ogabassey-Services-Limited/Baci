name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'biome.json'

  quality:
    name: Quality Gate
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.web == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - if: needs.changes.outputs.web == 'true'
        name: Clean stale pnpm setup directory
        run: rm -rf ~/setup-pnpm 2>/dev/null || true
      - if: needs.changes.outputs.web == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          # No cache: "pnpm" — the store is reset each run to avoid
          # cross-runner corruption during pnpm install.
      - if: needs.changes.outputs.web == 'true'
        name: Reset pnpm store to fix cross-runner install issues
        run: |
          export PNPM_STORE_DIR="${RUNNER_TEMP}/pnpm-store"
          rm -rf "${PNPM_STORE_DIR}" || true
          pnpm config set store-dir "${PNPM_STORE_DIR}"
      - if: needs.changes.outputs.web == 'true'
        run: pnpm install --frozen-lockfile
      # Run monorepo-wide lint/typecheck/test (not filtered to @baci/web)
      # to catch cross-package breakages from shared code changes
      - if: needs.changes.outputs.web == 'true'
        run: pnpm turbo lint typecheck test --concurrency=3
      - if: needs.changes.outputs.web == 'true'
        run: pnpm knip
      - if: needs.changes.outputs.web != 'true'
        run: echo "No web changes — skipping quality checks"

  build:
    name: Build
    needs: [changes, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.web == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - if: needs.changes.outputs.web == 'true'
        name: Clean stale pnpm setup directory
        run: rm -rf ~/setup-pnpm 2>/dev/null || true
      - if: needs.changes.outputs.web == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          # No cache: "pnpm" — the store is reset each run to avoid
          # cross-runner corruption during pnpm install.
      - if: needs.changes.outputs.web == 'true'
        name: Reset pnpm store to fix cross-runner install issues
        run: |
          export PNPM_STORE_DIR="${RUNNER_TEMP}/pnpm-store"
          rm -rf "${PNPM_STORE_DIR}" || true
          pnpm config set store-dir "${PNPM_STORE_DIR}"
      - if: needs.changes.outputs.web == 'true'
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/shared/src/**') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-build-
      - if: needs.changes.outputs.web == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.web == 'true'
        run: pnpm turbo build --filter=@baci/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}
      - if: needs.changes.outputs.web != 'true'
        run: echo "No web changes — skipping build"
