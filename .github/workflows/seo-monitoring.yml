name: SEO Monitoring

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: seo-monitoring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  search-console-readiness:
    name: Search Console Readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Clean stale pnpm setup directory
        run: rm -rf ~/setup-pnpm 2>/dev/null || true
      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - uses: ./.github/actions/pnpm-install-cached
        with:
          store-dir: ${{ runner.temp }}/pnpm-store
      - name: Audit live crawl surfaces
        run: pnpm --dir apps/web seo:readiness
        env:
          SEO_PLATFORM_ORIGIN: ${{ vars.SEO_PLATFORM_ORIGIN || 'https://usebaci.com' }}
          SEO_MERCHANT_ORIGINS: ${{ vars.SEO_MERCHANT_ORIGINS || 'https://ogabassey.com' }}

  pagespeed-insights:
    name: PageSpeed Insights
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Clean stale pnpm setup directory
        run: rm -rf ~/setup-pnpm 2>/dev/null || true
      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - uses: ./.github/actions/pnpm-install-cached
        with:
          store-dir: ${{ runner.temp }}/pnpm-store
      - name: Audit critical public URLs
        run: pnpm --dir apps/web seo:pagespeed
        env:
          SEO_PLATFORM_ORIGIN: ${{ vars.SEO_PLATFORM_ORIGIN || 'https://usebaci.com' }}
          PAGESPEED_EXTRA_URLS: ${{ vars.PAGESPEED_EXTRA_URLS || vars.SEO_MERCHANT_ORIGINS || 'https://ogabassey.com' }}
          PAGESPEED_STRATEGIES: ${{ vars.PAGESPEED_STRATEGIES || 'mobile,desktop' }}
          PAGE_SPEED_TIMEOUT_MS: ${{ vars.PAGE_SPEED_TIMEOUT_MS || '' }}
          PAGESPEED_INSIGHTS_API_KEY: ${{ secrets.PAGESPEED_INSIGHTS_API_KEY }}

  notify-slack:
    name: Notify SEO Monitoring Failure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - search-console-readiness
      - pagespeed-insights
    if: failure()
    steps:
      - name: Post failure summary to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SEO_MONITORING_SLACK_WEBHOOK_URL }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SEO_MONITORING_SLACK_WEBHOOK_URL is not configured; skipping Slack notification."
            exit 0
          fi

          node <<'NODE'
          async function main() {
            const webhookUrl = process.env.SLACK_WEBHOOK_URL;
            const workflowUrl = process.env.WORKFLOW_URL;
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10_000);

            let response;
            try {
              response = await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({
                  text: `SEO monitoring failed for Baci. Review the workflow run: ${workflowUrl}`,
                }),
                signal: controller.signal,
              });
            } catch (error) {
              if (error?.name === 'AbortError') {
                throw new Error('Slack notification timed out after 10000ms');
              }
              throw error;
            } finally {
              clearTimeout(timeout);
            }

            if (!response.ok) {
              throw new Error(`Slack notification failed with ${response.status}`);
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
