name: Mobb Security Auto-Fix

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  mobb-autofix:
    name: Mobb Security Autofix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Mobb Autofix
        uses: mobb-dev/action@v1.1
        with:
          report-file: ""
          api-key: ${{ secrets.MOBB_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
