name: Mobb Security Auto-Fix

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  mobb-autofix:
    name: Mobb Security Autofix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Run Mobb Autofix
        uses: mobb-dev/action@v1.1
        with:
          report-file: "semgrep.sarif"
          api-key: ${{ secrets.MOBB_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

